const $=(s,r=document)=>r.querySelector(s);
const q=new URLSearchParams(location.search),W=1920,H=1080,DUR=19;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`;}

/* pengganti ringkas blok atmosfer untuk generator pustaka (blok penuh ±18 KB memuat langit WebGL yang tak dipakai di sini) */
const LANGIT={tengah:'#8fa3a8',horizon:'#d6cdb4',warnaMatahari:'#fff0cf'},
  mulberry32=s=>()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;},
  acak=(i,s)=>{let x=(Math.imul(i,374761393)+Math.imul(s,668265263))|0;x=Math.imul(x^x>>>13,1274126177);return((x^x>>>16)>>>0)/4294967296;},
  vnoise=(x,s=1)=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f),a=acak(i,s);return a+(acak(i+1,s)-a)*u;},
  warnaRGB=c=>{const n=parseInt(String(c).slice(1,7),16);return[n>>16&255,n>>8&255,n&255];},
  warnaJarak=(c,z,zJauh=-800)=>{const k=Math.max(0,Math.min(1,z/zJauh)),a=warnaRGB(c),b=warnaRGB(LANGIT.horizon);return'#'+a.map((v,i)=>Math.round(v+(b[i]-v)*k).toString(16).padStart(2,'0')).join('');};
/* <wv:pustaka> dibangun dari src/runtime/pustaka.js — JANGAN edit di sini;
   ubah sumbernya lalu jalankan: node scripts/build-starters.mjs */
/* PUSTAKA ASET JAWA KUNO: kontrak, API, jebakan, catatan budaya: references/pustaka.md. Satu global `pustaka`. Generator = fungsi murni
   opsi → string SVG; api, asapHidup = kait kanvas dari tl.time(); dindingRelief = DATA untuk reliefHidup(). Butuh atmosfer (+ cahaya-2d).
   Uji tanpa browser: scripts/test-pustaka.mjs, scripts/test-relief.mjs. */
const pustaka=(()=>{
const{PI:P,round,cos,sin,max,min,hypot,imul,atan2,sqrt,abs,floor,ceil}=Math,f=v=>round(v*10)/10,tk=(x,y)=>f(x)+','+f(y),
  /* searah jarum jam: tumpukan menyatu (nonzero); cw=false = lubang */
  poly=(p,cw=true)=>{let a=0;p.forEach((q,i)=>{const n=p[(i+1)%p.length];a+=q[0]*n[1]-n[0]*q[1];});
    if(cw!==(a>0))p=p.slice().reverse();return'M'+p.map(q=>tk(q[0],q[1])).join('L')+'Z';},
  kotak=(x,y,w,h)=>poly([[x,y],[x+w,y],[x+w,y+h],[x,y+h]]),
  sim=(p,x=0,y=0)=>poly(p.map(([u,v])=>[x+u,y+v]).concat(p.map(([u,v])=>[x-u,y+v]).reverse())),
  el=(x,y,rx,ry,a=0)=>{const c=cos(a)*rx,s=sin(a)*rx,e=`A${f(rx)},${f(ry)} ${f(a*180/P)} 0 1 `;return`M${tk(x+c,y+s)}${e}${tk(x-c,y-s)}${e}${tk(x+c,y+s)}Z`;},
  qb=(a,c,b,n)=>Array.from({length:n+1},(_,i)=>{const t=i/n,u=1-t;return[u*u*a[0]+2*u*t*c[0]+t*t*b[0],u*u*a[1]+2*u*t*c[1]+t*t*b[1]];}),
  ruas=(p,w0,w1)=>{const A=[],B=[];p.forEach((q,i)=>{const a=p[max(0,i-1)],b=p[min(p.length-1,i+1)],dx=b[0]-a[0],dy=b[1]-a[1],
    m=hypot(dx,dy)||1,w=(w0+(w1-w0)*i/(p.length-1||1))/2;A.push([q[0]-dy/m*w,q[1]+dx/m*w]);B.push([q[0]+dy/m*w,q[1]-dx/m*w]);});return poly(A.concat(B.reverse()));},
  spiral=(x,y,r,n,sg=1)=>ruas(Array.from({length:n*8+1},(_,i)=>{const a=sg*i/8*P/2,k=r*(1-i/(n*9));return[x+cos(a)*k,y+sin(a)*k];}),r*.32,r*.06),
  stop=(o,c,a)=>`<stop offset="${o}" stop-color="${c}"${a!=null?` stop-opacity="${a}"`:''}/>`,
  lap=(d,c,op)=>d?`<path d="${d}" fill="${c}"${op?` opacity="${op}"`:''}/>`:'',
  hex=a=>'#'+a.map(v=>max(0,min(255,round(v))).toString(16).padStart(2,'0')).join(''),
  campur=(a,b,k)=>{const A=warnaRGB(a),B=warnaRGB(b);return hex(A.map((v,i)=>v+(B[i]-v)*k));},
  hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++)h=imul(h^s.charCodeAt(i),16777619);return(h>>>0).toString(36);},
  salah=(n,m)=>{throw new Error('pustaka.'+n+': '+m);},
  cekWarna=(n,k,v)=>typeof v==='string'&&/^(#[0-9a-f]{3}|#[0-9a-f]{6}|rgba?\([\d.,\s%]+\))$/i.test(v.trim())?v:salah(n,`${k} bukan warna #rrggbb atau rgb(): ${v}`),
  BAHAN={andesit:'#423f4a',bata:'#552d22',kayu:'#30231c',daun:'#1a1f1c',batu:'#5a5650'},
  POSITIF=['tinggi','lebar','skala','lapis','baris','n','celah'],
  OPS={seed:1,detail:null,cahaya:null,jarak:0,warna:null,id:null},SG=[-1,1];

/* opsi asing ditolak; angka hingga (POSITIF > 0); larik = pilihan (bawaan pertama); null = opsional */
function opsi(n,D,o={}){
  if(!o||typeof o!=='object'||Array.isArray(o))salah(n,'opsi harus objek {…}');
  for(const k in o)if(!(k in D))salah(n,`opsi tidak dikenal: ${k} (${Object.keys(D).join(' ')})`);
  const r={};for(const k in D){const d=D[k],v=o[k]===undefined?(Array.isArray(d)?d[0]:d):o[k];
    if(Array.isArray(d)){if(!d.includes(v))salah(n,`${k} tidak dikenal: ${v} (${d.join(' ')})`);}
    else if(typeof d==='number'){if(typeof v!=='number'||!isFinite(v))salah(n,`${k} harus angka (dapat ${v})`);
      if(POSITIF.includes(k)&&!(v>0))salah(n,`${k} harus > 0 (dapat ${v})`);}
    else if(v!=null&&k==='detail'&&![0,1,2].includes(v))salah(n,`detail harus 0, 1, atau 2 (dapat ${v})`);
    else if(v!=null&&k==='warna')[].concat(v).forEach(w=>cekWarna(n,k,w));
    else if(v!=null&&k==='id'&&!/^[A-Za-z][\w-]*$/.test(v))salah(n,`id diawali huruf; hanya huruf, angka, - dan _ (dapat ${v})`);
    r[k]=v;}
  return r;}
/* → vektor satuan ke cahaya, warna, kuat */
function lampu(n,c,cx,cy,c0){
  if(c==null)c=c0||{arah:235};
  if(typeof c==='string'){if(typeof ambilSumber!=='function')salah(n,`cahaya '${c}' butuh blok cahaya-2d (SUMBER)`);
    const s=ambilSumber(c);c={x:s.x,y:s.y,warna:s.warna,jangkau:s.jangkau,kuat:min(1,s.kuat??1)};}
  if(typeof c!=='object')salah(n,`cahaya harus nama SUMBER, {x,y} atau {arah} (dapat ${c})`);
  for(const k in c)if(!['x','y','arah','warna','jangkau','kuat'].includes(k))salah(n,`cahaya: kunci tidak dikenal: ${k} (x y arah warna jangkau kuat)`);
  const t=c.x!=null||c.y!=null;
  if(t?![c.x,c.y].every(Number.isFinite):!Number.isFinite(c.arah))salah(n,'cahaya harus {x,y} (angka, px bidang) atau {arah} (angka, derajat)');
  const a=t?atan2(c.y-cy,c.x-cx):c.arah*P/180,d=t?hypot(c.x-cx,c.y-cy):0;
  if(c.kuat!=null&&!(c.kuat>=0&&c.kuat<=1))salah(n,`cahaya.kuat harus 0..1 (dapat ${c.kuat})`);
  return{x:cos(a),y:sin(a),w:cekWarna(n,'cahaya.warna',c.warna||LANGIT.warnaMatahari),k:(c.kuat??.75)*(c.jangkau?max(.3,min(1,1.6-d/(1.6*c.jangkau))):1)};}
/* skala, detail, cahaya, nada warna, id */
function siap(n,o,bahan,c0){const L=lampu(n,o.cahaya,o.x,o.y-o.tinggi/2,c0),J=c=>warnaJarak(c,o.jarak,-2000),b=[].concat(o.warna||bahan)[0],t=campur(b,L.w,.24*L.k);
  const R=mulberry32(o.seed);
  return{s:o.tinggi/1000,L,R,r:(a,b)=>a+(b-a)*R(),dt:o.detail??(o.jarak<=-600?0:o.jarak<=-250?1:2),id:o.id||`wvp-${n}-${hash(JSON.stringify([o,L,LANGIT.horizon,LANGIT.tengah]))}`,
    N:{dasar:J(b),terang:J(t),lis:J(campur(b,t,.55)),gelap:J(campur(b,'#05040a',.66)),rim:J(campur(L.w,'#fff',.25)),cahaya:J(L.w)}};}
/* rim = siluet digeser ke cahaya, badan bergradien, lapisan K (S siluet, G bayang, L lis, T terang, D gelap, U sorot) */
function rakit(n,o,A,K,{tekstur,ekstra='',isi=''}={}){
  const{s,L,N,id}=A,T=`translate(${f(o.x)},${f(o.y)}) scale(${+s.toFixed(4)})`,g=v=>+(.5+.5*v).toFixed(2),
    rw=(.7+2*L.k)*min(1.25,max(.5,sqrt(o.tinggi/600)))/s,[tw,th,ts]=tekstur||[];
  return`<g id="${id}" class="wv-pustaka" data-pustaka="${n}" transform="${T}"><defs><path id="${id}-s" d="${K.S}"/>`+
    `<linearGradient id="${id}-v" x1="${g(L.x)}" y1="${g(L.y)}" x2="${g(-L.x)}" y2="${g(-L.y)}">${stop(0,N.terang)+stop(.45,N.dasar)+stop(1,N.gelap)}</linearGradient>`+
    `<clipPath id="${id}-k"><use href="#${id}-s" transform="${T}"/></clipPath>`+
    (tekstur?`<pattern id="${id}-t" patternUnits="userSpaceOnUse" width="${tw}" height="${2*th}"><path d="M0,0H${tw}M0,${th}H${tw}M0,0V${th}M${tw/2},${th}V${2*th}" stroke="${N.gelap}" stroke-width="${ts}"/></pattern>`:'')+
    `${ekstra}</defs><use href="#${id}-s" fill="${N.rim}" transform="translate(${f(L.x*rw)},${f(L.y*rw)})"/><use href="#${id}-s" fill="url(#${id}-v)"/>`+
    (tekstur?`<use href="#${id}-s" fill="url(#${id}-t)" opacity=".45"/>`:'')+lap(K.G,N.gelap,.6)+lap(K.L,N.lis)+lap(K.T,N.terang)+lap(K.D,N.gelap)+lap(K.U,N.terang)+isi+'</g>';}
const lapis=()=>({S:'',G:'',L:'',T:'',D:'',U:''}),
  /* blok [x,y,w,h,lis]: sisi atas + sisi ke cahaya = lis; lis membayangi dinding di bawahnya */
  tepi=(K,B,L)=>{const a=max(0,-L.y)*4.5,b=abs(L.x)*6;
    for(const[x,y,w,h,l]of B){if(a>1)K.L+=kotak(x,y,w,a);if(b>1)K.L+=kotak(L.x>0?x+w-b:x,y,b,h);if(l)K.G+=kotak(x+l,y+h,w-2*l,l*1.8);}},
  ratna=(x,y,h)=>sim([[0,-1],[.06,-.86],[.1,-.74],[.24,-.6],[.32,-.42],[.3,-.24],[.38,-.14],[.38,0]].map(([u,v])=>[u*h,v*h]),x,y),
  simbar=(x,y,h)=>sim([[0,-h],[.22*h,-.62*h],[.34*h,-.24*h],[.2*h,0]],x,y),
  /* kala: rahang = gaya Jawa Timur */
  kala=(K,cy,k,rahang)=>{const b=rahang?.8:.42;
    K.T+=sim([[0,-.98],[.3,-.92],[.62,-.78],[.98,-.62],[1.1,-.28],[.94,.08],[.62,b],[.2,b+.06],[0,b+.06]].map(([u,v])=>[u*k,v*k]),0,cy)+
      el(-1.2*k,cy-.5*k,.24*k,.4*k)+el(1.2*k,cy-.5*k,.24*k,.4*k);
    K.D+=el(-.38*k,cy-.36*k,.19*k,.19*k)+el(.38*k,cy-.36*k,.19*k,.19*k)+kotak(-.56*k,cy+.02*k,1.12*k,.2*k)+(rahang?kotak(-.44*k,cy+.5*k,.88*k,.1*k):'');

/* candi: andesit = Mataram Kuno, bata = Majapahit */
function candi(o){o=opsi('candi',{x:960,y:900,tinggi:520,varian:['andesit','bata'],...OPS},o);
  const bt=o.varian==='bata',A=siap('candi',o,bt?BAHAN.bata:BAHAN.andesit),{dt}=A,K=lapis(),B=[];let y=0;
  const blok=(w,h,l)=>{y-=h;B.push([-w/2,y,w,h,l]);K.S+=kotak(-w/2,y,w,h);};
  for(const[w,h,l]of bt?[[640,70],[662,12,8],[560,70],[582,12,8],[480,70],[502,12,8]]:[[880,34],[840,90],[884,30,12]])blok(w,h,l);
  const yk=y,yb=yk-(bt?22:28);
  for(const[w,h,l]of bt?[[384,22],[350,250],[404,26,12]]:[[606,28],[540,300],[614,34,14]])blok(w,h,l);
  for(let i=0;i<(bt?6:3);i++){const w=bt?340-44*i:470-100*i,c=w+(bt?22:40),h=bt?24-2*i:52-8*i;blok(w,bt?46-3*i:96-10*i);blok(c,bt?10:22,bt?6:10);
    for(const sg of SG){const x=sg*(c/2-(bt?8:14));K.S+=bt?simbar(x,y,h):ratna(x,y,h);if(!bt&&dt)K.T+=ratna(sg*c/4,y,h*.75);}}
  if(bt)blok(96,56);K.S+=ratna(0,y,1000+y);tepi(K,B,A.L);
  const pw=bt?84:104,ph=bt?170:214,k=bt?34:46,tw=bt?120:170;   // pintu + bingkai, kala (+ makara), tangga
  K.D+=kotak(-pw/2,yb-ph,pw,ph);K.T+=kotak(-pw/2-16,yb-ph-16,pw+32,16)+kotak(-pw/2-16,yb-ph,16,ph)+kotak(pw/2,yb-ph,16,ph)+kotak(-tw/2-22,yk,22,-yk)+kotak(tw/2,yk,22,-yk);
  for(let i=1;i*18<-yk;i++)K.D+=kotak(-tw/2,-i*18,tw,4);
  if(dt){kala(K,yb-ph-16-k*.9,k,bt);for(const sg of SG)K.L+=kotak(sg*(bt?150:236)-7,yb-(bt?220:270),14,bt?210:260);

/* gapura bata Majapahit: bentar (Wringin Lawang), paduraksa (Bajang Ratu) */
function gapura(o){o=opsi('gapura',{x:960,y:900,tinggi:600,varian:['bentar','paduraksa'],celah:170,...OPS},o);

/* alias kamera KOLASE (explainer.md "Resep kamera kolase") — angka & easing persis yang lama */
const look=(at,x,y,z,dur=1.6,ease='sine.inOut')=>camTo(at,dur,{fx:x,fy:y,zoom:z},ease);     // meluncur ke aset lain
const home=(at,x=W/2,y=H/2,dur=1.2)=>look(at,x,y,1,dur,'power2.inOut');                     // zoom out ke frame adegan, lalu DIAM

/* value-noise 1D ber-seed: hash bilangan bulat → interpolasi smoothstep. Dipakai handheld.

/* UKURAN SHOT (techniques.md §3b): berapa bagian frame yang diisi subjek. ECU 6,7× frame … EWS 0,1×. */
const SHOT={ECU:6.7,CU:2.86,MCU:1.67,MS:1.11,WS:.45,EWS:.1};
/* kotak elemen dalam koordinat root (dunia tanpa transform kamera, atau #stage untuk HUD). HTML: rantai
   offset. Elemen tanpa offsetLeft (SVG — bersarang, ber-viewBox, ber-transform): kotak layarnya relatif ke

/* SUDUT KAMERA. 2.5D: sudut kecil (dunia pipih); 3D: sudut film sungguhan. */
const ANGLE={
  dom:{eye:{pitch:0,yaw:0,roll:0},high:{pitch:-8},low:{pitch:8},overhead:{pitch:-8,zoom:'*=.8'},worm:{pitch:8,zoom:'*=1.3'},
       dutch:{roll:12},ots:{yaw:6,pitch:-3},pov:{pitch:0,yaw:0,roll:0,shake:.6}},
  three:{eye:{pitch:0,roll:0},high:{pitch:-30},low:{pitch:25,mm:24},overhead:{pitch:-89.9},worm:{pitch:60,mm:16},

const angle=(at,dur,name,o={},ease='power2.inOut')=>{const p=ANGLE[CAM.mode][name];
  if(!p)throw new Error('sudut tidak dikenal: '+name+' ('+Object.keys(ANGLE[CAM.mode]).join(' ')+')');

/* GERAK — relatif terhadap RENCANA ('+=', '*=' diselesaikan saat setup), jadi bisa dirantai tanpa tahu nilai sebelumnya */

  const y=PLAN.yaw*Math.PI/180;return camTo(at,dur,{fx:'+='+dx*Math.cos(y),fz:'+='+-dx*Math.sin(y)},ease);};   // 3D: geser sepanjang vektor kanan kamera
const pedestal=(at,dur,dy,ease)=>camTo(at,dur,{fy:'+='+dy},ease);                                      // dy>0 = turun (sumbu layar)
const pan=(at,dur,dYaw,ease)=>camTo(at,dur,{yaw:'+='+dYaw},ease);
const tilt=(at,dur,dPitch,ease)=>camTo(at,dur,{pitch:'+='+dPitch},ease);

const arc=(at,dur,toYaw,ease='sine.inOut')=>camTo(at,dur,{yaw:AXIS==null?toYaw:Math.max(AXIS-89,Math.min(AXIS+89,toYaw))},ease);

/* vertigo. 2.5D: subjek di z=0 tidak terpengaruh perspective, bidang data-z bergeser → cukup tween mm. */
const dollyZoom=(at,dur,mm,ease)=>camTo(at,dur,CAM.mode==='three'?{mm,dist:PLAN.dist*mm/PLAN.mm}:{mm},ease);   // 3D: dist/mm konstan → subjek di fokus tetap sebesar semula
/* whip pan (techniques.md §4c #6; bernama whipPan karena starter aksi kontinu sudah punya whip(t,dari,ke) antar-view): dunia bergeser 180 px + blur 0,28 dtk; panggil cutTo(at+.28, …) untuk shot berikutnya */

/* ZONA AMAN HUD: kamera tahu kantong teks, sehingga shot() tidak membawa subjek ke bawah label.

   ke dunia memakai kamera shot itu. */
const HUD=[];
const hud={
  reserve(sel,at,dur){const e=$(sel);if(!e)throw new Error('hud.reserve: '+sel+' tidak ada');HUD.push({sel,el:e,at,to:at+dur});},
  check(at,dur,r,v){for(const h of HUD){if(at+dur<h.at||at>h.to)continue;

    if(!dalam)p={x:(p.x-W/2)/v.zoom+v.fx,y:(p.y-H/2)/v.zoom+v.fy,w:p.w/v.zoom,h:p.h/v.zoom};   // layar → dunia

/* posisi kamera dari koordinat bola di sekitar fokus (derajat); pitch negatif = kamera di atas fokus, menunduk */
const pose=c=>{const y=c.yaw*Math.PI/180,p=c.pitch*Math.PI/180;
  return{x:c.fx+c.dist*Math.cos(p)*Math.sin(y),y:c.fy-c.dist*Math.sin(p),z:c.fz+c.dist*Math.cos(p)*Math.cos(y)};};

const jarakBingkai=(h,w,fill,mm,aspect=W/H)=>{if(!(Math.max(h,w)>0))throw new Error('jarakBingkai: ukuran subjek 0');
  if(!(fill>0)||!(mm>0))throw new Error('jarakBingkai: fill ('+fill+') dan mm ('+mm+') harus > 0');

   ubah sumbernya lalu jalankan: node scripts/build-starters.mjs */
/* BACKEND 3D — membaca CAM, menulis ke `camera` Three.js (r161). Starter menyediakan THREE, scene, camera,
   renderer, composer SEBELUM blok ini; render() starter memanggil applyCam() lalu composer.render(0).
   Di sini fx/fy/fz = koordinat dunia Three (Y ke atas), dist dalam unit dunia, yaw/pitch/roll derajat. */
CAM.mode='three';
camDefaults({fx:0,fy:0,fz:0,dist:10,yaw:0,pitch:0,mm:35,zoom:1,lantai:null});   // lantai: tinggi y bidang tanah (null = tanpa jepit)

/* satu jalur untuk kamera render DAN kamera bayangan cek3: pose, lookAt, roll, lensa. Keadaan rail hanya CAM.rail + CAM.railU (0..1).

    else{p=R.curve.getPointAt(c.railU);f=R.look;}}else{p=pose(c);f=[c.fx,c.fy,c.fz];}

  if(pts.length<3)throw new Error('rail: butuh ≥ 3 titik (CatmullRomCurve3 2 titik rusak di r161)');

/* handheld: noise ber-seed dari tl.time() → goyangan sama di putar, scrub, dan ekspor. Tidak me-render. */

  applyLux(arahkan(camera,CAM,dx,dy,dz,roll));   // lampu dihitung ulang tiap render/seek dari LUX + titik yang ditatap

const kotak3=o=>{o.updateWorldMatrix(true,true);const b=new THREE.Box3().setFromObject(o);if(b.isEmpty())throw new Error('shot: subjek 3D kosong — '+(o.name||o.type));

/* ZONA AMAN HUD 3D: proyeksikan 8 sudut kotak subjek dari pose AKHIR shot ke piksel panggung, bandingkan

/* rig key/fill/rim: satu set lampu, nilainya di-tween di LUX (fungsi murni tl.time() lewat onUpdate). */
const LUX={kAz:45,kEl:50,kI:0,kR:1,kG:1,kB:1,fI:0,fsR:1,fsG:1,fsB:1,fgR:1,fgG:1,fgB:1,rI:0};
const key=new THREE.DirectionalLight(0xffffff,0),fill=new THREE.HemisphereLight(0xffffff,0xffffff,0),rim=new THREE.DirectionalLight(0xffffff,0);
key.name='key';key.castShadow=true;key.shadow.mapSize.set(2048,2048);

function applyLux(f=[CAM.fx,0,CAM.fz]){const a=LUX.kAz*Math.PI/180,e=LUX.kEl*Math.PI/180,R=30,c=new THREE.Vector3(f[0],0,f[2]);

/* [key az, el, warna, I | fill sky, ground, I | rim I] — heuristik riset §Pencahayaan */
const CAHAYA3={
  day:   [45,50,'#FFF6E8',2.5,'#DDEBFF','#C9B79C',1.0,.6],
  golden:[60,6,'#FFB46B',2.8,'#FFD9A8','#6B4A3A',.5,1.2],
  blue:  [0,30,'#6FA8FF',0,'#6FA8FF','#1B2244',.8,.4],
  night: [200,40,'#9DB7FF',.3,'#2A3560','#0C1020',.25,.5],
  lowkey:[80,12,'#FFFFFF',1.4,'#FFFFFF','#000000',.12,0],
  studio:[45,35,'#FFFFFF',2.5,'#FFFFFF','#B0B0B0',.7,1.5]};
function nilaiLux(n){const [kAz,kEl,k,kI,s,g,fI,rI]=CAHAYA3[n],K=new THREE.Color(k),S=new THREE.Color(s),G=new THREE.Color(g);
  return{kAz,kEl,kI,kR:K.r,kG:K.g,kB:K.b,fI,fsR:S.r,fsG:S.g,fsB:S.b,fgR:G.r,fgG:G.g,fgB:G.b,rI};}
let lampAt=-Infinity;
function light(at,dur,preset,o={}){if(!CAHAYA3[preset])throw new Error('preset cahaya tidak dikenal: '+preset+' ('+Object.keys(CAHAYA3).join(' ')+')');

/* lampu praktis: PointLight di posisi dunia mesh + bahan berpendar (tidak kena tone mapping) */
function practical(mesh,color,intensity=2,distance=8){const c=warna(color),L=new THREE.PointLight(c,intensity,distance);

/* DIORAMA CEL-SHADED: toon + garis lambung + tilt-shift + alas + kartu 2D (references/diorama.md). Global `diorama`, TILT, GARIS. Keadaan = fungsi murni kamera + timeline.
   Butuh: THREE, mergeGeometries, ShaderPass, scene, camera, renderer, composer, W, H, hash, key, LUX. Meter, y ke atas. Uji: scripts/test-diorama.mjs. */
const TILT={pusat:.5,lebar:.18,lunak:.3,kuat:14};   // y layar: 0 atas, 1 bawah; pusat ± lebar = tajam; lunak = rentang naik ke kuat (px jari-jari di 1080p); kuat 0 = pass mati
const GARIS={tebal:2.2,acuan:45,warna:'#1a120c'};   // tebal px di jarak ≤ acuan m; lebih jauh menipis sampai 55 %
const diorama=(()=>{
  const ss=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
  /* ---------- murni ---------- */
  const jariTilt=(y,{pusat,lebar,lunak,kuat}=TILT)=>kuat*ss(lebar,lebar+lunak,Math.abs(y-pusat));   // sama dengan shader TILT_FS
  /* arah lambung: normal dirata-rata per posisi, supaya sudut menyambung */
  function arahLambung(p,n){const peta=new Map(),a=new Float32Array(p.length),k=i=>Math.round(p[i]*1e3)+'/'+Math.round(p[i+1]*1e3)+'/'+Math.round(p[i+2]*1e3);
    for(let i=0;i<p.length;i+=3){const s=peta.get(k(i))||[0,0,0];s[0]+=n[i];s[1]+=n[i+1];s[2]+=n[i+2];peta.set(k(i),s);}
    for(let i=0;i<p.length;i+=3){const s=peta.get(k(i)),l=Math.hypot(...s)||1;a[i]=s[0]/l;a[i+1]=s[1]/l;a[i+2]=s[2]/l;}return a;}
  /* tata kartu ber-seed: n titik di area [x0,z0,x1,z1], jarak antarkartu ≥ jarak, hindari(x,z) menolak. Stateless: seed + n → hasil sama */
  function tataKartu({seed=1,n,area:[x0,z0,x1,z1],jarak=1,hindari=()=>false,lapis=[]}){const o=[];
    if(!(n>=0)||!(jarak>0))throw new Error('diorama.tataKartu: n ≥ 0 dan jarak > 0');
    for(let i=0;i<n*60&&o.length<n;i++){const x=x0+(x1-x0)*hash(2*i+1,seed),z=z0+(z1-z0)*hash(2*i+2,seed);
      if(hindari(x,z)||[...o,...lapis].some(q=>Math.hypot(q.x-x,q.z-z)<jarak))continue;o.push({x,z,u:hash(2*i+3,seed+7)});}

  const TANGGA=[.34,.56,.8,1];

  /* ---------- rakit: kepingan kotak/prisma → satu mesh toon + satu mesh lambung (2 draw call, berapa pun kepingannya) ---------- */
  const warnaC=c=>new THREE.Color(c),LAMBUNG=[];
  function rakit({seed=1,alas=.8,beda=.05,bahan={}}={}){const isi=[],lambung=[];let n=0;
    /* warna verteks: ± beda per keping, dasar lebih gelap (cuci kotor maket) */
    const tambah=(g0,warna,{garis=true,kotor=alas}={})=>{const g=g0.toNonIndexed();g.deleteAttribute('uv');g.computeVertexNormals();n++;
      const p=g.attributes.position,col=new Float32Array(p.count*3),c=warnaC(warna),v=1+beda*(2*hash(n,seed)-1);let y0=Infinity,y1=-Infinity;
      for(let i=0;i<p.count;i++){const y=p.getY(i);y0=Math.min(y0,y);y1=Math.max(y1,y);}
      for(let i=0;i<p.count;i++){const k=v*(kotor+(1-kotor)*(p.getY(i)-y0)/((y1-y0)||1));col.set([c.r*k,c.g*k,c.b*k],i*3);}
      g.setAttribute('color',new THREE.BufferAttribute(col,3));g.setAttribute('bahan',new THREE.BufferAttribute(new Float32Array(p.count).fill(bahan[warna]||0),1));isi.push(g);
      if(garis){const h=new THREE.BufferGeometry();h.setAttribute('position',p);h.setAttribute('arah',new THREE.BufferAttribute(arahLambung(p.array,g.attributes.normal.array),3));lambung.push(h);}
      g0.dispose();};
    /* (x,z) = tengah, y = dasar. prisma: alas wb×db, atas wa×da setinggi h (wa,da → 0 = limas) */
    const R={kotak(x,y,z,w,h,d,warna,o){tambah(new THREE.BoxGeometry(w,h,d).translate(x,y+h/2,z),warna,o);},
      prisma(x,y,z,wb,db,wa,da,h,warna,o){const g=new THREE.BoxGeometry(wb,h,db),p=g.attributes.position;
        for(let i=0;i<p.count;i++)if(p.getY(i)>0)p.setXYZ(i,p.getX(i)*wa/wb,h/2,p.getZ(i)*da/db);
        tambah(g.translate(x,y+h/2,z),warna,o);},
      selesai(nama='diorama'){const G=new THREE.Group();G.name=nama;
        const mt=new THREE.MeshToonMaterial({vertexColors:true,gradientMap:gradasi()});mt.onBeforeCompile=pasangPola;const m=new THREE.Mesh(mergeGeometries(isi),mt);m.castShadow=m.receiveShadow=true;
        const l=new THREE.Mesh(mergeGeometries(lambung),new THREE.ShaderMaterial({side:THREE.BackSide,
          uniforms:{tebal:{value:GARIS.tebal},acuan:{value:GARIS.acuan},warna:{value:warnaC(GARIS.warna)},piksel:{value:new THREE.Vector2(1/W,1/H)}},vertexShader:LAMBUNG_VS,fragmentShader:LAMBUNG_FS}));
        LAMBUNG.push(l.material.uniforms);l.name='lambung';G.add(m,l);G.userData.toon=m;G.userData.lambung=l;for(const g of [...isi,...lambung])g.dispose();return G;}};
    return R;}
  /* pola bahan (1 bata, 2 paras, 4 ijuk, 5 alang): murni posisi dunia; memudar saat lebih rapat dari piksel */
  const POLA_FS=`varying float vB;varying vec3 vP,vN;float hB(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float natB(float v,float t){float d=min(fract(v),1.-fract(v));return 1.-smoothstep(t,t+fwidth(v),d);}
float polaB(){if(vB<.5)return 1.;vec3 n=abs(normalize(vN));float u=n.x>n.z?vP.z:vP.x;
if(vB>3.5){float b=vP.y/.2,a=u/.055+hB(vec2(floor(b),vB)),k=1.-smoothstep(.25,.7,fwidth(a));return mix(1.,(.86+.28*hB(vec2(floor(a),floor(b))))*(1.-.2*natB(b,.06)),k);}
if(n.y>.6)return 1.;float c=vB<1.5?.12:.4,l=vB<1.5?.34:.9,b=vP.y/c,r=floor(b),a=u/l+.5*mod(r,2.),k=1.-smoothstep(.2,.55,max(fwidth(b),fwidth(a)));
return mix(.97,(vB<1.5?.9+.2*hB(vec2(r,floor(a))):.95+.1*hB(vec2(r,floor(a))))*(1.-(vB<1.5?.3:.3)*max(natB(b,vB<1.5?.05:.025),natB(a,vB<1.5?.02:.012))),k);}`,
    pasangPola=sh=>{sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nattribute float bahan;varying float vB;varying vec3 vP,vN;').replace('#include <begin_vertex>','#include <begin_vertex>\nvB=bahan;vP=position;vN=normal;');
      sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\n'+POLA_FS).replace('#include <color_fragment>','#include <color_fragment>\ndiffuseColor.rgb*=polaB();');};
  /* lambung di ruang klip: geser sepanjang normal layar tebal px, lalu mundur sedikit */
  const LAMBUNG_VS=`attribute vec3 arah;uniform float tebal,acuan;uniform vec2 piksel;
void main(){vec4 v=modelViewMatrix*vec4(position,1.),c=projectionMatrix*v;vec2 n=(normalMatrix*arah).xy;float l=length(n);
if(l>1e-4)c.xy+=n/l*tebal*clamp(acuan/-v.z,.55,1.)*piksel*2.*c.w;c.z+=.00012*c.w;gl_Position=c;}`,
    LAMBUNG_FS=`uniform vec3 warna;void main(){gl_FragColor=vec4(warna,1.);}`;

  /* ---------- tilt-shift: dua pass Gauss terpisah; jari-jari per baris dari TILT (jariTilt). Linear HDR, sebelum OutputPass ---------- */
  const TILT_FS=`uniform sampler2D tDiffuse;uniform vec2 arah;uniform float pusat,lebar,lunak,kuat;varying vec2 vUv;
void main(){float t=clamp((abs(1.-vUv.y-pusat)-lebar)/max(lunak,1e-4),0.,1.),r=kuat*t*t*(3.-2.*t);vec4 c=texture2D(tDiffuse,vUv);
if(r<.25){gl_FragColor=c;return;}vec3 s=c.rgb;float b=1.;for(float i=1.;i<=6.;i+=1.){float u=i/6.,w=exp(-2.*u*u);vec2 d=arah*r*u;s+=w*(texture2D(tDiffuse,vUv+d).rgb+texture2D(tDiffuse,vUv-d).rgb);b+=2.*w;}

  /* ---------- alas: lempeng kayu + potongan tanah berstrata (potong:true) dengan bibir rumput tak rata. Muka atas y = y ---------- */
  function alas(R,{x0,x1,z0,z1,y=0,tebal=3,kayu=2.6,seed=3,warna=['#54402f','#775c43','#957957'],bibir='#5d6a39',kaki='#38261a',potong=true}){
    const w=x1-x0,d=z1-z0,cx=(x0+x1)/2,cz=(z0+z1)/2,h=tebal/warna.length;
    warna.forEach((c,i)=>R.kotak(cx,y-tebal+i*h,cz,w,h,d,c,{kotor:.92,garis:i===0}));
    R.kotak(cx,y-tebal-.5,cz,w+2.2,.5,d+2.2,kaki);R.prisma(cx,y-tebal-.5-kayu,cz,w+5,d+5,w+2.2,d+2.2,kayu,kaki,{kotor:.7});
    if(potong){const m=.9,sisi=[[x0,z0,x1,z0],[x0,z1,x1,z1],[x0,z0,x0,z1],[x1,z0,x1,z1]];let k=0;
      for(const[a,b,c,e]of sisi){const n=Math.ceil(Math.hypot(c-a,e-b)/m);for(let i=0;i<n;i++){k++;const u=(i+.5)/n,hh=.18+.5*hash(k,seed),t=.07,x=a+(c-a)*u,z=b+(e-b)*u;
        R.kotak(x+(a===c?(a===x0?-1:1)*t/2:0),y-hh,z+(b===e?(b===z0?-1:1)*t/2:0),a===c?t:m,hh,b===e?t:m,bibir,{garis:false,kotor:.75});}}}}
  /* meja & ruang: lantai gelap dengan kolam cahaya (kanvas, tanpa aset) */
  function meja({y=-6.1,r=420,warna='#3a3026',gelap='#0c0907',jari=.3}={}){const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d'),a=g.createRadialGradient(256,256,0,256,256,256);
    a.addColorStop(0,warna);a.addColorStop(jari,warna);a.addColorStop(1,gelap);g.fillStyle=a;g.fillRect(0,0,512,512);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
    const m=new THREE.Mesh(new THREE.PlaneGeometry(2*r,2*r).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({map:t}));m.position.y=y;m.name='meja';scene.add(m);return m;}

  /* ---------- kartu 2D di ruang 3D: SVG dirasterisasi SEKALI (Image → kanvas → tekstur), tepi tinta dipanggang ---------- */
  const tunggu=[],simpan=new Map(),KARTU=[],LABEL=[];
  function tekstur(svg,lw,lh,tepi,warnaTepi){const k=[svg,lw,lh,tepi,warnaTepi].join('|');if(simpan.has(k))return simpan.get(k);
    const c=document.createElement('canvas');c.width=lw;c.height=lh;const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;simpan.set(k,t);

  /* bayangan kontak lunak: satu tekstur radial bersama, di tanah, condong menjauhi matahari */
  let bayangT=null;const teksturBayang=()=>{if(bayangT)return bayangT;const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),a=g.createRadialGradient(64,64,0,64,64,64);
    a.addColorStop(0,'rgba(0,0,0,1)');a.addColorStop(.45,'rgba(0,0,0,.62)');a.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=a;g.fillRect(0,0,128,128);return bayangT=new THREE.CanvasTexture(c);};
  /* kartu(svg,{x,y,z,tinggi,lebar,hadap,resolusi,tepi,bayang}): svg = dokumen utuh ber-viewBox, dasar tengah kartu di (x,y,z).
     hadap null = billboard (berputar di sumbu y mengikuti kamera), derajat = tetap (0 menghadap +z). bayang = opasitas bayangan kontak (0 = tanpa). */
  function kartu(svg,{x=0,y=0,z=0,tinggi,lebar=tinggi,hadap=null,resolusi=720,tepi=2,warnaTepi=GARIS.warna,bayang=.5,nama=''}){
    if(!(tinggi>0))throw new Error('diorama.kartu: tinggi > 0');
    if(!/viewBox=/.test(svg))throw new Error('diorama.kartu: svg harus dokumen <svg> ber-viewBox');

      m=new THREE.Mesh(new THREE.PlaneGeometry(lebar,tinggi).translate(0,tinggi/2,0),new THREE.MeshBasicMaterial({map:tekstur(svg,lw,lh,tepi,warnaTepi),alphaTest:.5,alphaToCoverage:true,side:THREE.DoubleSide}));
    m.position.set(x,y,z);m.name=nama;if(hadap!=null)m.rotation.y=hadap*Math.PI/180;scene.add(m);KARTU.push({m,hadap});
    if(bayang>0){const b=new THREE.Mesh(new THREE.PlaneGeometry(1,1).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({map:teksturBayang(),color:'#000',transparent:true,opacity:bayang,depthWrite:false}));
      const a=LUX.kAz*Math.PI/180,g=lebar*.72;b.scale.set(g,1,g*.6);b.position.set(x-Math.sin(a)*g*.12,y+.03,z-Math.cos(a)*g*.12);b.rotation.y=a;b.renderOrder=1;scene.add(b);m.userData.bayang=b;}
    return m;}
  /* latar lukis: dinding melengkung di belakang maket (sisi kaja), ciri diorama museum. svg ber-viewBox, sudut derajat di sekitar arah −z */
  function latar(svg,{r=70,sudut=170,tinggi=40,y=-6.1,x=0,z=0,resolusi=720}){const a=sudut*Math.PI/180,g=new THREE.CylinderGeometry(r,r,tinggi,64,1,true,Math.PI-a/2,a).translate(x,y+tinggi/2,z);

/* PURA BALI — denah tri mandala GENERIK untuk diorama (bukan pura tertentu; sumber: references/diorama.md › Akurasi).
   TRI_MANDALA = data denah; pura.bangun(R,T) merakit kepingan lewat R.kotak/R.prisma (diorama.rakit); pura.tanah(T,batas) melukis lantai tiga halaman.
   Arah: kaja (ke gunung) = −z, kelod (ke laut) = +z, kangin = +x, kauh = −x. Meter. Tanpa arca, sesajen, atau perlengkapan upacara. Diuji test-diorama.mjs. */
const TRI_MANDALA={lebar:26,
  zona:[{id:'nista',nama:'Nista mandala',jaba:'jaba sisi',z:[31,17],y:0},
    {id:'madya',nama:'Madya mandala',jaba:'jaba tengah',z:[17,-1],y:.5},
    {id:'utama',nama:'Utama mandala',jaba:'jeroan',z:[-1,-25],y:1}],
  gerbang:[{jenis:'candiBentar',dari:'nista',ke:'madya',z:17},{jenis:'koriAgung',dari:'madya',ke:'utama',z:-1}],
  bangunan:[{jenis:'wantilan',zona:'nista',x:-6.6,z:24.2},
    {jenis:'baleKulkul',zona:'madya',x:-11,z:14.8},   // kelod-kauh madya
    {jenis:'baleGong',zona:'madya',x:7,z:7.6},
    {jenis:'padmasana',zona:'utama',x:9,z:-20.8,hadap:'kauh'},   // kaja-kangin, menghadap kauh
    {jenis:'meru',zona:'utama',x:9.2,z:-12,tumpang:5,hadap:'kauh'},
    {jenis:'meru',zona:'utama',x:9.2,z:-5.4,tumpang:3,hadap:'kauh'},
    {jenis:'balePawedan',zona:'utama',x:-6,z:-14}]};
const pura=(()=>{
  const P={bata:'#84533f',bataMuda:'#90604d',paras:'#a59a85',parasTua:'#7f7768',batu:'#55534d',ijuk:'#2f2b27',ijukTepi:'#47423a',alang:'#8f7c58',alangTua:'#726248',kayu:'#624429',kayuMerah:'#6e3a2a',emas:'#97793f'},
    BAHAN={[P.bata]:1,[P.bataMuda]:1,[P.paras]:2,[P.parasTua]:2,[P.batu]:2,[P.ijuk]:4,[P.ijukTepi]:4,[P.alang]:5,[P.alangTua]:5},
    zona=(T,id)=>{const z=T.zona.find(q=>q.id===id);if(!z)throw new Error('pura: zona tak dikenal: '+id);return z;};
  /* atap meru: selalu ganjil (3–11). Tiap tingkat = rok landai + badan curam; kembali [{y,wb,wm,wa,hr,hb}] dari dasar atap */
  function tingkatMeru(n,{b0=2.8,b1=.95,tinggi=.92,sela=.4}={}){
    if(!Number.isInteger(n)||n%2===0||n<3||n>11)throw new Error('pura: tumpang meru harus ganjil 3–11 (dapat '+n+')');

/* ---------- kontrol: autoplay + loop tanpa player; ?debug=1 panel; ?clean=1 export ---------- */

/* <wv:grain> dibangun dari src/runtime/grain.js — JANGAN edit di sini;
   ubah sumbernya lalu jalankan: node scripts/build-starters.mjs */
/* grain hidup (techniques.md §7d): lapisan butiran film teratas di #stage — di luar #world, jadi tidak
   meratakan paralaks [data-z]. Tile noise dirasterisasi sekali; per frame hanya transform di lapisannya
   sendiri, melompat 12× per detik dengan posisi fungsi murni tl.time() (bukan Math.random) — sama di
   play, scrub, dan ekspor. Memakai tl.eventCallback('onUpdate'); callback yang sudah ada tetap dipanggil,
   jadi pasang onUpdate timeline milik proyek SEBELUM grainHidup(). Latar gelap: overlay .15–.3;
   latar terang: multiply .06–.15. */
function grainHidup(tl, {opacity=.14, blend='overlay', freq=.85}={}){
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='${freq}' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='2.5 0 0 0 -.75 2.5 0 0 0 -.75 2.5 0 0 0 -.75 0 0 0 0 1'/></filter><rect width='256' height='256' filter='url(%23n)'/></svg>`;
  const el=document.createElement('div'); el.className='wv-grain';
  el.style.cssText=`position:absolute;inset:-60px;pointer-events:none;z-index:50;opacity:${opacity};mix-blend-mode:${blend};will-change:transform;transform:translate(-30px,-30px);`+
    `background-image:url("data:image/svg+xml,${svg.replace(/</g,'%3C').replace(/>/g,'%3E')}")`;
  document.getElementById('stage').appendChild(el);
  const prev=tl.eventCallback('onUpdate');
  tl.eventCallback('onUpdate',function(){const k=Math.floor(tl.time()*12);
    el.style.transform=`translate(${k*37%60-30}px,${k*61%60-30}px)`;if(prev)prev.apply(this,arguments);});
  return el;
}
/* </wv:grain> */
/* <wv:seek> dibangun dari src/runtime/seek.js — JANGAN edit di sini;
   ubah sumbernya lalu jalankan: node scripts/build-starters.mjs */
/* seek sinkron untuk snap.mjs / export-frames.mjs / konsol: GSAP menulis gaya secara
   lazy di tick berikutnya dan kanvas menunggu rAF (yang dithrottle di tab tersembunyi),
   jadi tanpa ini screenshot tertinggal satu langkah. pause(t,false) sengaja TIDAK menekan
   callback: onUpdate (applyCam/render) harus ikut jalan saat scrub. apply() = cara starter
   ini menggambar ulang dirinya (kamera, render loop, atau keduanya). */
function makeSeek(tl, apply){ return t => {
  // lompat jauh (worker ekspor kedua, Chrome dibuka ulang): onUpdate tween jalan sebelum nilai tulis-tunda masuk → pose lama. Berhenti sesaat
  // SEBELUM t lalu maju, supaya onUpdate jalan lagi dengan nilai yang sudah masuk; dari sesudah t malah membatalkan set() yang tepat di t.
  if (Math.abs(tl.time() - t) > .1) { tl.pause(Math.max(0, t - 1e-3), false); if (gsap.ticker.tick) gsap.ticker.tick(); }
  if (tl.time() === t) tl.pause(t + 1e-4, false);   // pause(t) dari playhead yang sudah di t = no-op: set() pada t=0 tak pernah diterapkan di halaman segar
  tl.pause(t, false);
  if (gsap.ticker.tick) gsap.ticker.tick(); if (apply) apply(t); }; }
/* </wv:seek> */
grainHidup(tl,{opacity:.1});
window.OPENER={W,H,DURATION:DUR,tl,ready:false,seek:makeSeek(tl,t=>render(t)),play:start,syncSeek:true};

  sc.addEventListener('input',()=>{tl.pause();tl.time(sc.value/1000*DUR);});$('#dPlay').onclick=()=>tl.paused()?tl.play():tl.pause();}
/* </wv:explainer-controls> */

/* ---------- kait untuk scripts/test-starters.mjs — tidak dipanggil deliverable ---------- */
window.DIORAMA_UJI=(mutasi='')=>{const gl=renderer.getContext(),t0=tl.time(),lb=MAKET.userData.lambung,pf=diorama.perFrame,tGaris=GARIS.tebal,tm=renderer.toneMapping;
  const baca=t=>{tl.pause(t);render(t);const a=new Uint8Array(W*H*4);gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,a);return a;},
    L=(a,x,y)=>{const i=((H-1-y)*W+x)*4;return .2126*a[i]+.7152*a[i+1]+.0722*a[i+2];},   // y dari atas
    tajam=(a,y0,y1)=>{let s=0,n=0;for(let y=Math.max(1,y0);y<Math.min(H-1,y1);y+=2)for(let x=1;x<W-1;x+=2){s+=Math.abs(4*L(a,x,y)-L(a,x-1,y)-L(a,x+1,y)-L(a,x,y-1)-L(a,x,y+1));n++;}return s/Math.max(1,n);},   // rata-rata |Laplacian|
    tanpaTilt=fn=>{const lama=diorama.perFrame;diorama.perFrame=()=>{lama();for(const p of diorama.passTilt)p.enabled=false;};const h=fn();diorama.perFrame=lama;return h;};
  /* mutasi: satu per pemeriksaan; test-starters menuntut pemeriksaannya gagal */
  let n=0;if(mutasi==='jam')diorama.perFrame=()=>{GARIS.tebal=tGaris+.8*(n++%2);pf();};
  if(mutasi==='garis')lb.visible=false;
  if(mutasi==='tilt')diorama.perFrame=()=>{pf();for(const p of diorama.passTilt)p.enabled=false;};
  if(mutasi==='tone')renderer.toneMapping=THREE.NoToneMapping;
  const r={toneMapping:renderer.toneMapping},tA=D[5]+1;
  const a=baca(tA);baca(D[2]);baca(.1);const b=baca(tA);let beda=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])beda++;r.ulangBeda=beda;
  /* tilt: frame apa adanya vs pass tilt mati, detik sama. Pita diukur dari TILT detik itu */
  const f=baca(tA),{pusat,lebar,lunak}=TILT,polos=tanpaTilt(()=>baca(tA)),
    yF0=Math.round((pusat-lebar*.8)*H),yF1=Math.round((pusat+lebar*.8)*H),atas=Math.round((pusat-lebar-lunak*.8)*H),bawah=Math.round((pusat+lebar+lunak*.8)*H);
  let fb=0;for(let y=yF0;y<yF1;y++){const i0=(H-1-y)*W*4;for(let i=i0;i<i0+W*4;i++)if(f[i]!==polos[i])fb++;}
  r.tilt={atas:tajam(f,0,atas)/Math.max(1e-6,tajam(polos,0,atas)),bawah:tajam(f,bawah,H)/Math.max(1e-6,tajam(polos,bawah,H)),fokusBeda:fb};
  /* garis: frame apa adanya vs lambung dimatikan, di pita fokus */
  const vis=lb.visible;lb.visible=false;const tg=baca(tA);lb.visible=vis;let g=0,m=0,tot=0;
  for(let y=yF0;y<yF1;y++)for(let x=0;x<W;x++){tot++;const u=L(f,x,y),w=L(tg,x,y);if(w-u>10){g++;m+=u;}}
  r.garis={persen:100*g/tot,gelap:g?m/g:255};
  diorama.perFrame=pf;GARIS.tebal=tGaris;lb.visible=true;renderer.toneMapping=tm;tl.pause(t0);render(t0);return r;};
document.fonts.ready.then(()=>diorama.siap()).then(()=>{tl.pause(0);render(0);window.OPENER.ready=true;if(q.has('clean'))return;
  if(!hasVO){start();return;}
  vo.play().then(()=>{audioOn=true;vo.currentTime=0;tl.play(0);}).catch(()=>{const go=()=>{removeEventListener('pointerdown',go);removeEventListener('keydown',go);start();};addEventListener('pointerdown',go);addEventListener('keydown',go);});});
