  Ini ARSITEKTUR + PERKAKAS, bukan gaya dan bukan kerangka: stage 1920x1080, rig kamera
  #world, scene Three.js ber-state, 8 pintu teks, transisi opsional, autoplay + loop tanpa

  =====  STYLE BRIEF — isi dulu, baru sentuh kode (SKILL.md Hukum #3)  =====
  Tema/produk + 3 kata sifat : ____________________
  Konsep (opener-konsep.md)   : kandidat 1 ______ / 2 ______ / 3 ______  -> dipilih: ______
  Sidik jari struktur         : konsep · n adegan · objek tiap adegan · pembuka · penutup
  Palet (dari brand)          : utama #______  latar #______  aksen #______
  Font display / pendamping   : ____________  / ____________   (bukan Poppins/Inter/Roboto/Montserrat)
  Bahasa latar (1 arah)       : sinematik gelap | poster color-block | editorial terang | kertas & cetak |
                                retro analog | brutalis mono | pastel ceria | mewah gelap
  Tanda tangan gerak (objek)  : ____________________
  Gerak latar (menu §7c)      : ____________________
  Permukaan latar (menu §7d)  : ____________________   (gradien/cahaya/tekstur, bukan flat)
  Transisi (menu §4c, per batas) : ____________________   (batas mana butuh efek, mana cukup cut; tanpa balok/persegi datar menyapu)
  Momen istimewa              : ____________________
  Lensa default (mm)          : ____   (35 netral · 24 lebar/dramatis · 50–85 potret/kompresi)
  Sudut & gerak pembuka       : ____________________   (mis. WS high angle → dolly in ke MS)
  Preset cahaya per segmen + pemicu pergantian : ____________________
  ==========================================================================

  Semua warna di bawah sengaja ABU-ABU dan fontnya font sistem: kalau masih
  terlihat di hasil, gaya belum diturunkan dari tema. Latar WebGL (nebula,

  (S.grid/dust/stars = 0, sembunyikan #gl, ganti latar #stage/.bgfx).
  GERAK LATAR dipilih dari menu techniques.md §7c (isi di style brief) — jangan

  Jangan meniru kulit video referensi dan jangan membuka proyek lama.
-->

:root{

  --accent:#8A8F98; --accent-lit:#C4C8CF;

}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;
  font-family:"Sora",system-ui,sans-serif;color:var(--ink)}   /* GANTI: font display dari style brief */
#filters{position:fixed;width:0;height:0;opacity:0;pointer-events:none}

/* panggung dipatok 1920x1080, discale ke jendela — komposisi tidak berubah */
#stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;
  transform:translate(-50%,-50%) scale(1);overflow:hidden;background:var(--base)}
#world{position:absolute;inset:0;will-change:transform}   /* rig kamera */
#gl{position:absolute;inset:0;width:1920px;height:1080px;display:block}
.bgfx{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;

    color-mix(in srgb, var(--accent) 12%, transparent) 48%, transparent 70%)}
#dom{position:absolute;inset:0}

.scene{position:absolute;inset:0;display:flex;align-items:center;

/* state awal tersembunyi DI CSS (tween pakai immediateRender:false).
   Jangan pernah menulis opacity di selector yang lebih spesifik dari ini. */

.hero-wrap{perspective:1400px}
.hero.sm{font-size:74px}.hero.md{font-size:92px}.hero.lg{font-size:128px}.hero.xl{font-size:150px;font-weight:600}
.txt2{display:inline-block;opacity:0}                      /* tanda baca OPSIONAL: hanya bila kalimat memang bertanda baca */
/* kata sorotan OPSIONAL (style brief boleh memilih tanpa sorotan): .hl + SATU varian bentuk: pill | under | marker | box | color. Ornamen tidak default. */
.hl{position:relative;display:inline-block}
.hl i{position:absolute;transform:scaleX(0);transform-origin:0 50%}

.hl.pill{padding:.02em .24em .04em;border-radius:.26em}
.hl.pill i{inset:0;border-radius:inherit;background:linear-gradient(95deg,color-mix(in srgb,var(--accent) 70%,#000),var(--accent) 60%,var(--accent-lit))}
.hl.pill .hl-t{color:#fff}
.hl.under i{left:0;right:0;bottom:-.04em;height:.14em;border-radius:.07em;background:var(--accent)}

.hl.box i{inset:-.06em -.14em;border:.04em solid var(--accent);border-radius:.12em;background:none}

.paper .b{position:absolute;border-radius:50%;pointer-events:none}
.paper .b1{left:-260px;top:-380px;width:1100px;height:1100px;background:radial-gradient(circle,color-mix(in srgb,var(--accent-lit) 38%,#fff) 0%,transparent 68%)}
.paper .b2{left:1180px;top:520px;width:1000px;height:1000px;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 22%,#fff) 0%,transparent 66%)}
.paper .b3{left:420px;top:700px;width:800px;height:800px;background:radial-gradient(circle,color-mix(in srgb,var(--accent-lit) 26%,#fff) 0%,transparent 66%)}

.hero{font-size:142px;font-weight:500;letter-spacing:-.01em;color:#fff;

/* light leak: lapisan PALING ATAS (cahaya di depan lensa, bukan bagian dunia) */
.leak{position:absolute;left:50%;top:50%;width:2400px;height:2400px;
  margin:-1200px 0 0 -1200px;border-radius:50%;

    color-mix(in srgb, var(--accent-lit) 85%, white),
    color-mix(in srgb, var(--accent) 55%, transparent) 34%,

  filter:blur(64px);mix-blend-mode:screen;opacity:0;pointer-events:none;z-index:40}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:10;
  background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 30%),

      rgba(0,0,0,.6) 86%,rgba(0,0,0,.92) 100%)}

#ui{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  display:flex;align-items:center;gap:14px;padding:11px 18px;border-radius:16px;

  font-size:13px;color:#A0A6B4;z-index:50}

#ui.on{display:flex}
#ui button{background:#262A34;color:#fff;border:none;padding:8px 16px;
  border-radius:9px;font:inherit;cursor:pointer}

#clock{font-variant-numeric:tabular-nums;min-width:5.2ch;text-align:right} /* digit selebar sama: kartu tidak bergetar */
</style>

      <!-- Adegan, jumlahnya, dan urutannya ditulis dari rundown KONSEP (references/opener-konsep.md).

<script type="module">
import * as THREE from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass }       from 'three/addons/postprocessing/BokehPass.js';
import { SVGLoader }       from 'three/addons/loaders/SVGLoader.js';

/* ============ UTIL: split per huruf + motion blur berarah ============ */
const $=(s,r=document)=>r.querySelector(s);
/* <wv:blur> dibangun dari src/runtime/blur.js — JANGAN edit di sini;
   ubah sumbernya lalu jalankan: node scripts/build-starters.mjs */
/* motion blur BERARAH (techniques.md §2): feGaussianBlur menerima stdDeviation
   "x y" terpisah, jadi kaburnya mengikuti ARAH gerak — `filter:blur()` CSS mengabur
   ke segala arah dan terbaca "tidak fokus". Filter dibuat per tween lalu DILEPAS
   saat selesai: elemen yang terus memakai filter SVG dirasterisasi ulang tiap frame. */
const defs=$('#filters defs'); let fc=0;
function makeBlur(){
  const id='mb'+(fc++), NS='http://www.w3.org/2000/svg';
  const f=document.createElementNS(NS,'filter'); f.id=id;
  f.setAttribute('x','-70%');f.setAttribute('y','-70%');           // kotak default
  f.setAttribute('width','240%');f.setAttribute('height','240%');  // memotong ekor
  const g=document.createElementNS(NS,'feGaussianBlur');
  g.setAttribute('stdDeviation','0 0'); f.appendChild(g); defs.appendChild(f);
  return {url:`url(#${id})`,node:g};
}
function blurTween(tl,targets,at,from,to,dur,{ease='power3.out',ax=1,ay=.08}={}){
  const b=makeBlur(),o={v:from};
  tl.set(targets,{filter:b.url},at);
  tl.to(o,{v:to,duration:dur,ease,onUpdate(){
    b.node.setAttribute('stdDeviation',`${(o.v*ax).toFixed(2)} ${(o.v*ay).toFixed(2)}`);}},at);
  tl.set(targets,{filter:'none'},at+dur); // lepas: filter permanen = raster ulang tiap frame
}
const VERT={ax:.1,ay:1}, HORZ={ax:1,ay:.1};
/* </wv:blur> */
function splitChars(el){
  const words=(el.textContent||'').split(' '); el.textContent=''; const out=[];
  words.forEach((w,i)=>{
    const wr=document.createElement('span'); wr.className='wd';
    for(const c of w){const s=document.createElement('span');s.className='ch';
      s.textContent=c;wr.appendChild(s);out.push(s);}
    el.appendChild(wr);
    if(i<words.length-1){const sp=document.createElement('span');sp.className='ch';
      sp.innerHTML='&nbsp;';el.appendChild(sp);out.push(sp);}
  });
  return out;
}

/* ============ DUNIA WEBGL BER-STATE (tanpa jam sendiri) ============ */
const W=1920,H=1080;
const renderer=new THREE.WebGLRenderer({canvas:$('#gl'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(W,H,false);
renderer.toneMapping=THREE.NoToneMapping;   // warna brand tepat lewat composer+OutputPass (mat() juga toneMapped:false)
/* SEMUA warna WebGL diturunkan dari token CSS (style brief). Tidak ada warna hardcode di lapisan 3D:
   ganti --accent/--accent-lit/--base di :root, seluruh dunia ikut. Bentuk ornamen (bintang 4 sudut) juga
   placeholder — turunkan dari logo/tema (starShape) atau ganti geometrinya. */
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ACC=new THREE.Color(cssVar('--accent')),ACL=new THREE.Color(cssVar('--accent-lit')),BASE=new THREE.Color(cssVar('--base'));
const scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(BASE.getHex(),.012);
const camera=new THREE.PerspectiveCamera(50,W/H,.1,400);

const S={ grid:.3, dust:.5, stars:0,
          bloom:.85, heroO:0,heroS:1,heroX:0,heroY:0,heroZ:6 };

/* acak BER-SEED: tata letak sama di setiap muat → snapshot & MP4 identik (Math.random berbeda tiap muat) */
const rng=(s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;})(1337);
/* debu: kelip via sinus per-seed — bukan random per frame */
{const N=1200,pos=new Float32Array(N*3),seed=new Float32Array(N);
 for(let i=0;i<N;i++){pos[i*3]=(rng()-.5)*90;pos[i*3+1]=(rng()-.5)*52;
   pos[i*3+2]=-rng()*60+8;seed[i]=rng()*6.283;}
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.BufferAttribute(pos,3));
 g.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
 var dustMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,
  blending:THREE.AdditiveBlending,
  uniforms:{uTime:{value:0},uOpacity:{value:.5},uPix:{value:Math.min(devicePixelRatio,2)},uColor:{value:ACL}},
  vertexShader:`attribute float aSeed;varying float vA;uniform float uTime;uniform float uPix;
   void main(){vec3 p=position;p.y+=sin(uTime*.35+aSeed)*.9;
   vec4 mv=modelViewMatrix*vec4(p,1.);vA=.35+.65*abs(sin(uTime*.9+aSeed*3.1));
   gl_PointSize=(28.*uPix)/(-mv.z);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying float vA;uniform float uOpacity;uniform vec3 uColor;
   void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;
   gl_FragColor=vec4(uColor,pow(1.-d*2.,2.4)*vA*uOpacity);}`});
 scene.add(new THREE.Points(g,dustMat));}

/* grid lantai: fade JAUH sebelum horizon (garis menumpuk = pita terang) */
const gridMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,
 blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
 uniforms:{uTime:{value:0},uOpacity:{value:0},uC1:{value:ACC},uC2:{value:ACL}},
 vertexShader:`varying vec2 vUv;void main(){vUv=uv;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`varying vec2 vUv;uniform float uTime;uniform float uOpacity;uniform vec3 uC1;uniform vec3 uC2;
  void main(){vec2 p=vUv*46.;p.y+=uTime*2.6;
  vec2 g=abs(fract(p)-.5)/fwidth(p);float line=1.-min(min(g.x,g.y),1.);
  float d=length(vUv-.5)*2.;float fade=1.-smoothstep(.04,.60,d);
  gl_FragColor=vec4(mix(uC1,uC2,fade),line*fade*uOpacity);}`});
const grid=new THREE.Mesh(new THREE.PlaneGeometry(170,170),gridMat);
grid.rotation.x=-Math.PI/2; grid.position.y=-6.4; scene.add(grid);

/* ornamen 3D: extrude + cahaya (Basic = flat = rasa PPT) */
function starShape(){const s=new THREE.Shape(),R=1,c=.09; // c kecil = ujung runcing
 s.moveTo(0,R);s.quadraticCurveTo(c,c,R,0);s.quadraticCurveTo(c,-c,0,-R);
 s.quadraticCurveTo(-c,-c,-R,0);s.quadraticCurveTo(-c,c,0,R);return s;}
const starGeo=new THREE.ExtrudeGeometry(starShape(),{depth:.26,bevelEnabled:true,
 bevelThickness:.06,bevelSize:.07,bevelSegments:3}); starGeo.center();
const mkMat=()=>new THREE.MeshStandardMaterial({color:ACL.getHex(),emissive:ACC.getHex(),
 emissiveIntensity:.6,roughness:.28,metalness:.2,transparent:true,opacity:0});
const AMB=[[-9.5,4.2,-7,.62,.5,.7],[8.6,4.8,-9,.8,-.36,2.1],[-7.2,-3.8,-4,.44,.62,3.9],
 [9.4,-3.2,-7,.55,-.55,1.3],[5.8,5.9,-3,.34,-.7,.2],[3.4,-5.4,-11,.7,.42,4.4]];
const ambStars=AMB.map(d=>{const m=new THREE.Mesh(starGeo,mkMat());
 m.position.set(d[0],d[1],d[2]);m.scale.setScalar(d[3]);m.userData=d;scene.add(m);return m;});
const heroMat=mkMat();heroMat.emissiveIntensity=.85;
const heroStar=new THREE.Mesh(starGeo,heroMat);scene.add(heroStar);

const composer=new EffectComposer(renderer); composer.setSize(W,H);
composer.addPass(new RenderPass(scene,camera));
/* threshold TINGGI — ambang rendah membuat seluruh frame berkabut putih */
const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),.8,.7,.52);
composer.addPass(bloom); composer.addPass(new OutputPass());

function render(t){ // t = tl.time(); TIDAK ADA jam lain di file ini
  dustMat.uniforms.uTime.value=t; dustMat.uniforms.uOpacity.value=S.dust;
  gridMat.uniforms.uTime.value=t; gridMat.uniforms.uOpacity.value=S.grid;
  for(const m of ambStars){const d=m.userData,tw=.45+.55*Math.abs(Math.sin(t*.9+d[5]));
    m.material.opacity=S.stars*tw; m.visible=m.material.opacity>.01;
    m.rotation.z=t*d[4]+d[5];
    m.rotation.y=Math.sin(t*d[4]*1.4+d[5])*.55;  // goyang, bukan putar penuh
    m.position.y=d[1]+Math.sin(t*.5+d[5])*.5;}
  heroMat.opacity=S.heroO; heroStar.visible=S.heroO>.01;
  heroStar.position.set(S.heroX,S.heroY,S.heroZ);
  heroStar.scale.setScalar(1.6*S.heroS);
  heroStar.rotation.z=t*.45; heroStar.rotation.y=Math.sin(t*.7)*.6;
  applyCam();   // kamera dari CAM (kamera-three), bukan dari S
  bloom.strength=S.bloom;
  composer.render(0);   // 0: tanpa argumen, composer membaca Clock sendiri
}

/* ============ TIMELINE — satu-satunya tempat waktu ditulis ============ */
const Q=new URLSearchParams(location.search);
const DURATION=8.0;                       // GANTI: dari rundown konsep
const tl=gsap.timeline({paused:true});
const rig=$('#world'), leak=$('#leak');
const DUR=DURATION;   // blok kamera-three membaca DUR
/* <wv:kamera> dibangun dari src/runtime/kamera.js — JANGAN edit di sini;
   ubah sumbernya lalu jalankan: node scripts/build-starters.mjs */
/* KAMERA — satu objek keadaan, fungsi murni dari tl.time() (SKILL.md Hukum #2).
   Inti ini TIDAK menyentuh DOM/WebGL: ia hanya menulis angka ke CAM lewat tween GSAP berdetik
   absolut. Backend (kamera-dom / kamera-three) mendefinisikan applyCam() yang membaca CAM dan
   menggambar. Kosakata: techniques.md §3b. */
const CAM={mode:'dom',          // 'dom' (2.5D) | 'three' — diisi backend
  fx:W/2,fy:H/2,fz:0,           // titik fokus (koordinat dunia)
  zoom:1,                       // 2.5D: skala rig; 3D: camera.zoom
  dist:10,yaw:0,pitch:0,roll:0, // kamera relatif ke fokus (derajat); 2.5D: yaw/pitch kecil = tilt/paralaks
  mm:35,                        // lensa (filmGauge 36); 2.5D: perspective = W*mm/36 px
  focus:0,aperture:0,           // rack focus (aperture 0 = mati)
  shake:0,seed:1,               // handheld: value-noise ber-seed, bukan Math.random
  blur:0};                      // blur berarah saat whip
/* RENCANA: bayangan CAM saat setup. Nilai relatif ('+=220', '*=1.4') diselesaikan DI SINI menjadi angka
   absolut — GSAP menyelesaikan nilai relatif saat tween pertama kali dirender, sehingga hasilnya bergantung
   jalur seek (putar ≠ lompat ≠ worker export). Karena itu gerak relatif wajib dipanggil urut waktu. */
const PLAN={...CAM},P0=W*35/36;let planAt=-Infinity;

const mutlak=(at,v)=>{const o={};for(const k in v){let x=v[k];
  if(typeof x==='string'){if(at<planAt)throw new Error('gerak relatif harus dipanggil urut waktu (detik '+at+' setelah '+planAt+')');
    const op=x.slice(0,2),n=parseFloat(x.slice(2));
    if(!['+=','-=','*='].includes(op)||isNaN(n))throw new Error('nilai relatif tidak dikenal: '+k+' '+x+' (pakai +=, -=, *=)');
    x=op==='*='?PLAN[k]*n:op==='-='?PLAN[k]-n:PLAN[k]+n;}

const camReset=()=>{gsap.killTweensOf(CAM);Object.assign(PLAN,CAM);planAt=-Infinity;};       // buang semua gerak kamera yang sudah ditulis
/* alias kamera KOLASE (explainer.md "Resep kamera kolase") — angka & easing persis yang lama */
const look=(at,x,y,z,dur=1.6,ease='sine.inOut')=>camTo(at,dur,{fx:x,fy:y,zoom:z},ease);     // meluncur ke aset lain
const home=(at,x=W/2,y=H/2,dur=1.2)=>look(at,x,y,1,dur,'power2.inOut');                     // zoom out ke frame adegan, lalu DIAM
const into=(cutAt,x,y,z)=>camTo(cutAt-.9,.9,{fx:x,fy:y,zoom:z},'power2.in');                // push-through sebelum cut
const settle=(cutAt,x,y,z)=>camTo(cutAt,1.1,{fx:x,fy:y,zoom:z*.94},'power3.out');           // mendarat setelah cut

/* value-noise 1D ber-seed: hash bilangan bulat → interpolasi smoothstep. Dipakai handheld.

/* UKURAN SHOT (techniques.md §3b): berapa bagian frame yang diisi subjek. ECU 6,7× frame … EWS 0,1×. */
const SHOT={ECU:6.7,CU:2.86,MCU:1.67,MS:1.11,WS:.45,EWS:.1};
/* kotak elemen dalam koordinat root (dunia tanpa transform kamera, atau #stage untuk HUD). HTML: rantai
   offset. Elemen tanpa offsetLeft (SVG — bersarang, ber-viewBox, ber-transform): kotak layarnya relatif ke

  return{x,y,w:el.offsetWidth,h:el.offsetHeight};}

function shot(at,dur,size,el,{ease='power2.inOut',fill=SHOT[size]}={}){
  if(!fill)throw new Error('ukuran shot tidak dikenal: '+size+' (ECU CU MCU MS WS EWS)');
  if(CAM.mode==='three'&&CAM.frame3d){const v=CAM.frame3d(fill,el);CAM.cek3&&CAM.cek3(at,dur,el,v);camTo(at,dur,v,ease);return v;}   // 3D: el = Object3D atau nama, bukan selector DOM
  if(typeof el==='string'){const sel=el;el=$(sel);if(!el)throw new Error('shot: subjek '+sel+' tidak ada');}

  for(let n=el.parentNode;n&&n!==rig;n=n.parentNode)if(n.dataset&&n.dataset.z!=null){
    const p=rectIn(n,rig),s0=(P0-n.dataset.z)/P0,ox=p.x+p.w/2,oy=p.y+p.h/2;cx=ox+s0*(cx-ox);cy=oy+s0*(cy-oy);break;}
  const v={fx:cx,fy:cy,zoom:Math.max(.1,Math.min(6,Math.min(W*fill/r.w,H*fill/r.h)))};
  hud.check(at,dur,r,v);
  if(dur===0&&lastShot&&lastShot.el===el&&lastShot.size===size&&Math.abs(lastShot.yaw-PLAN.yaw)<30)
    console.warn('aturan 30°: cut ke subjek yang sama dengan ukuran '+size+' tanpa beda sudut ≥ 30° terasa jump cut (detik '+at+')');
  lastShot={el,size,yaw:PLAN.yaw};
  camTo(at,dur,v,ease);return v;}

/* SUDUT KAMERA. 2.5D: sudut kecil (dunia pipih); 3D: sudut film sungguhan. */
const ANGLE={
  dom:{eye:{pitch:0,yaw:0,roll:0},high:{pitch:-8},low:{pitch:8},overhead:{pitch:-8,zoom:'*=.8'},worm:{pitch:8,zoom:'*=1.3'},
       dutch:{roll:12},ots:{yaw:6,pitch:-3},pov:{pitch:0,yaw:0,roll:0,shake:.6}},
  three:{eye:{pitch:0,roll:0},high:{pitch:-30},low:{pitch:25,mm:24},overhead:{pitch:-89.9},worm:{pitch:60,mm:16},
         dutch:{roll:15},ots:{yaw:35,pitch:-8,mm:50},pov:{pitch:0,roll:0,mm:28,shake:.5}}};
const angle=(at,dur,name,o={},ease='power2.inOut')=>{const p=ANGLE[CAM.mode][name];
  if(!p)throw new Error('sudut tidak dikenal: '+name+' ('+Object.keys(ANGLE[CAM.mode]).join(' ')+')');

/* GERAK — relatif terhadap RENCANA ('+=', '*=' diselesaikan saat setup), jadi bisa dirantai tanpa tahu nilai sebelumnya */
const dolly=(at,dur,k,ease)=>camTo(at,dur,CAM.mode==='three'?{dist:'*='+(1/k)}:{zoom:'*='+k},ease);   // k>1 mendekat
const truck=(at,dur,dx,ease)=>{if(CAM.mode!=='three')return camTo(at,dur,{fx:'+='+dx},ease);
  const y=PLAN.yaw*Math.PI/180;return camTo(at,dur,{fx:'+='+dx*Math.cos(y),fz:'+='+-dx*Math.sin(y)},ease);};   // 3D: geser sepanjang vektor kanan kamera
const pedestal=(at,dur,dy,ease)=>camTo(at,dur,{fy:'+='+dy},ease);                                      // dy>0 = turun (sumbu layar)
const pan=(at,dur,dYaw,ease)=>camTo(at,dur,{yaw:'+='+dYaw},ease);
const tilt=(at,dur,dPitch,ease)=>camTo(at,dur,{pitch:'+='+dPitch},ease);

let AXIS=null;const rule180=a=>{AXIS=a;};                                                             // garis aksi (yaw); null = bebas
const arc=(at,dur,toYaw,ease='sine.inOut')=>camTo(at,dur,{yaw:AXIS==null?toYaw:Math.max(AXIS-89,Math.min(AXIS+89,toYaw))},ease);
const lens=(at,dur,mm,ease)=>camTo(at,dur,{mm},ease);
/* vertigo. 2.5D: subjek di z=0 tidak terpengaruh perspective, bidang data-z bergeser → cukup tween mm. */
const dollyZoom=(at,dur,mm,ease)=>camTo(at,dur,CAM.mode==='three'?{mm,dist:PLAN.dist*mm/PLAN.mm}:{mm},ease);   // 3D: dist/mm konstan → subjek di fokus tetap sebesar semula
/* whip pan (techniques.md §4c #6; bernama whipPan karena starter aksi kontinu sudah punya whip(t,dari,ke) antar-view): dunia bergeser 180 px + blur 0,28 dtk; panggil cutTo(at+.28, …) untuk shot berikutnya */
const whipPan=(at,dir=1)=>{if(CAM.mode==='three')return camTo(at,.28,{yaw:'+='+(70*dir)},'power2.in');   // 3D: putar yaw, tanpa blur rig

/* handheld: backend memanggil applyCam dari ticker selama CAM.shake ≠ 0, jadi goyangan hidup saat diputar DAN saat seek */
const handheld=(a,b,amp=.5)=>{camTo(a,.3,{shake:amp},'sine.out');camTo(b-.3,.3,{shake:0},'sine.in');};
/* ZONA AMAN HUD: kamera tahu kantong teks, sehingga shot() tidak membawa subjek ke bawah label.

   ke dunia memakai kamera shot itu. */
const HUD=[];
const hud={
  reserve(sel,at,dur){const e=$(sel);if(!e)throw new Error('hud.reserve: '+sel+' tidak ada');HUD.push({sel,el:e,at,to:at+dur});},
  check(at,dur,r,v){for(const h of HUD){if(at+dur<h.at||at>h.to)continue;
    const dalam=rig.contains(h.el);let p=rectIn(h.el,dalam?rig:$('#stage'));
    if(!dalam)p={x:(p.x-W/2)/v.zoom+v.fx,y:(p.y-H/2)/v.zoom+v.fy,w:p.w/v.zoom,h:p.h/v.zoom};   // layar → dunia
    if(r.x<p.x+p.w&&r.x+r.w>p.x&&r.y<p.y+p.h&&r.y+r.h>p.y)

/* posisi kamera dari koordinat bola di sekitar fokus (derajat); pitch negatif = kamera di atas fokus, menunduk */
const pose=c=>{const y=c.yaw*Math.PI/180,p=c.pitch*Math.PI/180;

const jarakBingkai=(h,w,fill,mm,aspect=W/H)=>{if(!(Math.max(h,w)>0))throw new Error('jarakBingkai: ukuran subjek 0');
  if(!(fill>0)||!(mm>0))throw new Error('jarakBingkai: fill ('+fill+') dan mm ('+mm+') harus > 0');
  const d=Math.max(h,w/aspect)/fill*mm*Math.max(aspect,1)/36;if(!isFinite(d))throw new Error('jarakBingkai: ukuran subjek 0');return d;};
/* </wv:kamera> */
/* <wv:kamera-three> dibangun dari src/runtime/kamera-three.js — JANGAN edit di sini;
   ubah sumbernya lalu jalankan: node scripts/build-starters.mjs */
/* BACKEND 3D — membaca CAM, menulis ke `camera` Three.js (r161). Starter menyediakan THREE, scene, camera,
   renderer, composer SEBELUM blok ini; render() starter memanggil applyCam() lalu composer.render(0).
   Di sini fx/fy/fz = koordinat dunia Three (Y ke atas), dist dalam unit dunia, yaw/pitch/roll derajat. */
CAM.mode='three';
camDefaults({fx:0,fy:0,fz:0,dist:10,yaw:0,pitch:0,mm:35,zoom:1,rail:-1,railU:0,lantai:null});   // lantai: tinggi y bidang tanah (null = tanpa jepit)

const warna=c=>new THREE.Color(typeof c==='string'&&c.startsWith('--')?getComputedStyle(document.documentElement).getPropertyValue(c).trim():c);

/* ---------- KAMERA ---------- */
/* satu jalur untuk kamera render DAN kamera bayangan cek3: pose, lookAt, roll, lensa */
const RAILS=[];   // {curve,look} — dibuat saat setup; keadaan rail hanya CAM.rail (indeks, -1 = mati) dan CAM.railU (0..1)
/* lantai: kamera tidak pernah turun di bawah c.lantai+0,05 (low/worm sesudah WS, dip di tengah tween) — dijepit per frame */

  cam.position.set(p.x+dx,p.y+dy,p.z+dz);cam.lookAt(f[0],f[1],f[2]);cam.rotateZ(roll*Math.PI/180);

/* rail: kamera meluncur sepanjang Catmull-Rom (≥ 3 titik) sambil menatap titik `look`. Di ujung, CAM kembali ke pose bola

function rail(at,dur,pts,{look=null,ease='sine.inOut'}={}){

  if(pts.length<3)throw new Error('rail: butuh ≥ 3 titik (CatmullRomCurve3 2 titik rusak di r161)');

    cutTo(at+dur,{rail:-1,fx:f[0],fy:f[1],fz:f[2],dist:d,pitch:-Math.asin(dy/d)*180/Math.PI,yaw:Math.atan2(dx,dz)*180/Math.PI})];}
/* handheld: noise ber-seed dari tl.time() → goyangan sama di putar, scrub, dan ekspor. Tidak me-render. */
function applyCam(){let dx=0,dy=0,dz=0,roll=CAM.roll;
  if(CAM.shake){const t=tl.time(),a=CAM.shake,s=CAM.seed;
    dx=(noise(t*1.7,s)-.5)*.1*a;dy=(noise(t*1.3,s+1)-.5)*.1*a;dz=(noise(t*1.1,s+3)-.5)*.1*a;roll+=(noise(t*.9,s+2)-.5)*.6*a;}
  arahkan(camera,CAM,dx,dy,dz,roll);applyLux();   // lampu dihitung ulang tiap render/seek dari LUX+CAM

/* updateWorldMatrix(true,true): setFromObject tidak memperbarui rantai induk — sebelum render pertama subjek bersarang terbaca di posisi lokal */
const kotak3=o=>{o.updateWorldMatrix(true,true);const b=new THREE.Box3().setFromObject(o);if(b.isEmpty())throw new Error('shot: subjek 3D kosong — '+(o.name||o.type));
  const s=b.getSize(new THREE.Vector3());if(Math.max(s.x,s.y)<=0)throw new Error('shot: subjek 3D berukuran 0 — '+(o.name||o.type)+' (skala 0 dari tl.from?)');return b;};

  return{fx:c.x,fy:c.y,fz:c.z,dist:jarakBingkai(s.y,s.x,fill,PLAN.mm)+dalam};};
/* ZONA AMAN HUD 3D: proyeksikan 8 sudut kotak subjek dari pose AKHIR shot ke piksel panggung, bandingkan
   dengan kotak elemen HUD di #stage. Sudut di belakang kamera = subjek menelan frame. */

/* ---------- CAHAYA, LAMPU PRAKTIS, FOKUS ---------- */
/* rig key/fill/rim: satu set lampu, nilainya di-tween di LUX (fungsi murni tl.time() lewat onUpdate). */
const LUX={kAz:45,kEl:50,kI:0,kR:1,kG:1,kB:1,fI:0,fsR:1,fsG:1,fsB:1,fgR:1,fgG:1,fgB:1,rI:0};
const key=new THREE.DirectionalLight(0xffffff,0),fill=new THREE.HemisphereLight(0xffffff,0xffffff,0),rim=new THREE.DirectionalLight(0xffffff,0);
key.name='key';key.castShadow=true;key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-20,right:20,top:20,bottom:-20,near:1,far:80});
scene.add(key,key.target,fill,rim,rim.target);
function applyLux(){const a=LUX.kAz*Math.PI/180,e=LUX.kEl*Math.PI/180,R=30,c=new THREE.Vector3(CAM.fx,0,CAM.fz);
  key.position.set(c.x+R*Math.cos(e)*Math.sin(a),R*Math.sin(e),c.z+R*Math.cos(e)*Math.cos(a));key.target.position.copy(c);
  key.color.setRGB(LUX.kR,LUX.kG,LUX.kB);key.intensity=LUX.kI;
  fill.color.setRGB(LUX.fsR,LUX.fsG,LUX.fsB);fill.groundColor.setRGB(LUX.fgR,LUX.fgG,LUX.fgB);fill.intensity=LUX.fI;
  rim.position.set(c.x-R*.5,R*.6,c.z-R*.8);rim.target.position.copy(c);rim.intensity=LUX.rI;}
/* [key az, el, warna, I | fill sky, ground, I | rim I] — heuristik riset §Pencahayaan */
const CAHAYA3={
  day:   [45,50,'#FFF6E8',2.5,'#DDEBFF','#C9B79C',1.0,.6],
  golden:[60,6,'#FFB46B',2.8,'#FFD9A8','#6B4A3A',.5,1.2],
  blue:  [0,30,'#6FA8FF',0,'#6FA8FF','#1B2244',.8,.4],
  night: [200,40,'#9DB7FF',.3,'#2A3560','#0C1020',.25,.5],
  lowkey:[80,12,'#FFFFFF',1.4,'#FFFFFF','#000000',.12,0],
  studio:[45,35,'#FFFFFF',2.5,'#FFFFFF','#B0B0B0',.7,1.5]};
function nilaiLux(n){const [kAz,kEl,k,kI,s,g,fI,rI]=CAHAYA3[n],K=new THREE.Color(k),S=new THREE.Color(s),G=new THREE.Color(g);
  return{kAz,kEl,kI,kR:K.r,kG:K.g,kB:K.b,fI,fsR:S.r,fsG:S.g,fsB:S.b,fgR:G.r,fgG:G.g,fgB:G.b,rI};}
let lampAt=-Infinity;
function light(at,dur,preset,o={}){if(!CAHAYA3[preset])throw new Error('preset cahaya tidak dikenal: '+preset+' ('+Object.keys(CAHAYA3).join(' ')+')');

  return tl.to(LUX,{...nilaiLux(preset),...o,duration:dur,ease:'sine.inOut'},at);}
/* lampu praktis: PointLight di posisi dunia mesh + bahan berpendar (tidak kena tone mapping) */
function practical(mesh,color,intensity=2,distance=8){const c=warna(color),L=new THREE.PointLight(c,intensity,distance);
  mesh.getWorldPosition(L.position);scene.add(L);

const MAT={
  flat:     c=>new THREE.MeshBasicMaterial({color:c,toneMapped:false}),
  toon:     c=>new THREE.MeshToonMaterial({color:c,gradientMap:TOON,toneMapped:false}),
  clay:     c=>new THREE.MeshStandardMaterial({color:c,roughness:.9,metalness:0,toneMapped:false}),

/* logo/ikon SVG (string, bukan berkas — file:// memblokir loader) → grup 3D. depth/bevel dalam unit DUNIA
   (dibagi scale karena geometri dibangun dalam unit SVG). Geometri dipusatkan, jadi grup.position bebas dipakai. */
function fromSVG(svg,{depth=.2,bevel=.02,family='toon',scale=.01}={}){const g=new THREE.Group();
  for(const p of new SVGLoader().parse(svg).paths){if(p.userData&&p.userData.style&&p.userData.style.fill==='none')continue;   // garis saja: tak punya isi untuk diekstrusi
    const m=mat(family,p.color);
    for(const s of SVGLoader.createShapes(p))
      g.add(new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:depth/scale,bevelEnabled:bevel>0,bevelSize:bevel/scale,bevelThickness:bevel/scale}),m));}
  const c=kotak3(g).getCenter(new THREE.Vector3());for(const m of g.children)m.geometry.translate(-c.x,-c.y,-c.z);
  g.scale.set(scale,-scale,scale);return g;}   // SVG y ke bawah → balik

if(Q.has('demo')){
  const scA=$('#sc-a'), la=$('#line-a'), ch=splitChars($('.txt',la));
  tl.set([scA,la],{autoAlpha:1},0);
  let t=.3;
  for(const [pin,pout] of [[inUp,outUp],[inDown,outDown],[inLeft,outLeft],[inRight,outRight],[inDepth,outDepth]]){
    pin(ch,la,t); pout(ch,la,t+1.15); t+=1.7; }
  inMask(ch,la,t); outDepth(ch,la,t+1.2); t+=1.8;
  inWords(ch,la,t); outUp(ch,la,t+1.3); t+=1.9;
  tl.to({},{duration:.01},t);
}
tl.to({},{duration:.01},DURATION);

/* ============ PEREKAT ============ */
const stage=$('#stage');
const fit=()=>{const s=Math.min(innerWidth/1920,innerHeight/1080);
  stage.style.transform=`translate(-50%,-50%) scale(${s})`;};
addEventListener('resize',fit); fit();

const clock=$('#clock'),scrub=$('#scrub'),btn=$('#btn-play');
let scrubbing=false;
(function frame(){ const t=tl.time(); render(t);
  clock.textContent=t.toFixed(2)+'s';
  if(!scrubbing)scrub.value=String(t/DURATION*1000);
  requestAnimationFrame(frame); })();

const toggle=()=>{ if(tl.paused()||tl.time()>=DURATION){
    if(tl.time()>=DURATION)tl.time(0); tl.play(); btn.textContent='Pause';}
  else{tl.pause();btn.textContent='Play';} };
btn.onclick=toggle;
$('#btn-restart').onclick=()=>{tl.pause(0);tl.play();btn.textContent='Pause';};
scrub.addEventListener('pointerdown',()=>{scrubbing=true;tl.pause();btn.textContent='Play';});
addEventListener('pointerup',()=>scrubbing=false);
scrub.addEventListener('input',()=>{tl.pause();tl.time(scrub.value/1000*DURATION);});
addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();toggle();}
  if(/^[rR]$/.test(e.key)){tl.pause(0);tl.play();}
  if(/^[hH]$/.test(e.key))$('#ui').classList.toggle('on'); });
if(Q.has('debug'))$('#ui').classList.add('on');            // default: TANPA player
/* default: loop — dari jam, BUKAN onComplete: tween repeat:-1 membuat durasi timeline tak hingga */
gsap.ticker.add(()=>{ if(!tl.paused()&&tl.time()>=DURATION)tl.play(0); });

/* split diukur SETELAH font termuat — fallback memberi lebar salah */
/* seek sinkron: paksa GSAP menulis gaya + gambar kanvas sekarang (rAF bisa dithrottle) */
/* <wv:seek> dibangun dari src/runtime/seek.js — JANGAN edit di sini;
   ubah sumbernya lalu jalankan: node scripts/build-starters.mjs */
/* seek sinkron untuk snap.mjs / export-frames.mjs / konsol: GSAP menulis gaya secara
   lazy di tick berikutnya dan kanvas menunggu rAF (yang dithrottle di tab tersembunyi),
   jadi tanpa ini screenshot tertinggal satu langkah. pause(t,false) sengaja TIDAK menekan
   callback: onUpdate (applyCam/render) harus ikut jalan saat scrub. apply() = cara starter
   ini menggambar ulang dirinya (kamera, render loop, atau keduanya). */
function makeSeek(tl, apply){ return t => { if (tl.time() === t) tl.pause(t + 1e-4, false);   // pause(t) dari playhead yang sudah di t = no-op: set() pada t=0 tak pernah diterapkan di halaman segar
  tl.pause(t, false);
  if (gsap.ticker.tick) gsap.ticker.tick(); if (apply) apply(t); }; }
/* </wv:seek> */
const seek=makeSeek(tl,t=>render(t));
window.OPENER={W,H,tl,DURATION,seek,ready:false};   // dipakai konsol & skrip snap/export
/* <wv:footage> dibangun dari src/runtime/footage.js — JANGAN edit di sini;
   ubah sumbernya lalu jalankan: node scripts/build-starters.mjs */
/* ================= FOOTAGE — layer video yang terikat timeline (seperti footage di After Effects) =================
   Markup : <div class="clipbox"><video class="clip" src="assets/klip.mp4" muted playsinline preload="auto"></video></div>
   Pasang : const k = clip($('#v1'), {at:4, in:1.5, out:6, rate:1, hold:false});
            at = detik timeline klip mulai · in/out = potongan sumber (dtk) · rate = kecepatan · hold = tahan frame akhir
   Animasi: tween PEMBUNGKUSNYA dengan tl (posisi, skala, mask, opacity, filter). Isi video mengikuti jam timeline,
            bukan jamnya sendiri — scrub ?debug=1, snap.mjs, dan export-frames.mjs (OPENER.seekFrame) tetap presisi.
   Format : MP4 H.264 (yuv420p, +faststart) atau WebM VP9, tanpa suara, 720p–1080p, 3–8 dtk per klip. */
var CLIPS = CLIPS || [];
function clip(el, o){ o = o || {}; el.muted = true; el.playsInline = true; el.preload = 'auto'; el.loop = false;
  try { el.pause(); } catch(e) {}
  var c = { el: el, at: o.at || 0, inT: o.in || 0, out: (o.out == null ? null : o.out), rate: o.rate || 1, hold: !!o.hold };
  (CLIPS = CLIPS || []).push(c); return c; }
function clipTime(c, t){ var end = c.out != null ? c.out : (isFinite(c.el.duration) ? c.el.duration : 1e9);
  var lt = (t - c.at) * c.rate; if (lt < 0) return null; var vt = c.inT + lt;
  if (vt > end - 1/120) { if (!c.hold) return null; vt = end - 1/60; } return vt; }
function syncClips(t, playing){ for (var i = 0; i < CLIPS.length; i++){ var c = CLIPS[i], v = c.el, vt = clipTime(c, t);
  if (vt === null) { if (!v.paused) v.pause(); continue; }
  if (playing) { if (v.playbackRate !== c.rate) v.playbackRate = c.rate; if (v.paused) v.play().catch(function(){});
    if (Math.abs(v.currentTime - vt) > .2) v.currentTime = vt; }
  else { if (!v.paused) v.pause(); if (Math.abs(v.currentTime - vt) > 1/90) v.currentTime = vt; } } }
function seekClips(t){ return Promise.all(CLIPS.map(function(c){ return new Promise(function(res){
  var v = c.el, vt = clipTime(c, t); try { v.pause(); } catch(e) {}
  if (vt === null) return res();
  var fin = function(){ requestAnimationFrame(function(){ requestAnimationFrame(res); }); };
  if (Math.abs(v.currentTime - vt) < 1/240 && v.readyState >= 2) return fin();
  var to = setTimeout(res, 4000);
  v.addEventListener('seeked', function h(){ v.removeEventListener('seeked', h); clearTimeout(to); fin(); });
  v.currentTime = vt; }); })); }
gsap.ticker.add(function(){ if (CLIPS.length) syncClips(window.OPENER.tl.time(), !window.OPENER.tl.paused()); });
window.OPENER.clipsReady = function(){ return CLIPS.every(function(c){ return c.el.readyState >= 2; }); };
window.OPENER.seekFrame = function(t){ window.OPENER.seek(t); return seekClips(t); };   // ekspor/snap: tunggu frame klip
/* </wv:footage> */
document.fonts.ready.then(()=>{window.OPENER.ready=true;if(!Q.has('clean'))tl.play(0);});   // autoplay; ?clean=1 (export) tidak autoplay
</script>
