<title>WeVai — Starter Relief Candi Hidup (galeri kapal bercadik)</title>
<!--
  STARTER RELIEF CANDI HIDUP satu-berkas, 16:9 — gaya 100 % KODE (SVG + Canvas 2D + WebGL2), tanpa gambar atau aset luar.
  Dinding galeri candi dari andesit berpahat menjadi BINGKAI NARASI: cahaya obor menyapu batu dan bayangan di pahatan ikut
  bergeser, tokoh relief hidup pelan (lengan pendayung, layar, ombak, untaian permata, payung), kamera berjalan menyusuri galeri.
  Isi bawaan, 20 dtk: tiga panel ala Borobudur dibaca searah pradaksina (menghadap dinding, cerita mengalir ke KIRI):
  prosesi berangkat → perahu bercadik berlayar → tiba di bawah kalpataru; satu legenda dokumenter saat panel perahu.
  Yang penting di sini adalah RIG-nya, bukan isinya:
    - bidang [data-z] di rig #world: −1500 gunung + kabut, −600 deret stupa teras atas, 0 dinding relief (SATU kanvas WebGL2
      .wv-relief); kamera CAM berjalan–berhenti–berjalan (truck) + handheld tipis → bidang berparalaks
    - reliefHidup(bidang,{dinding:pustaka.dindingRelief({…})}): peta tinggi + normal + AO dipanggang SEKALI saat muat, cahaya
      SINAR dihitung ulang tiap frame (bayangan pahatan ikut bergeser) — kosakata, resep, biaya: references/relief-candi.md
    - SINAR = lampu yang di-tween seperti CAM: x, y (px bidang), z (jarak dari muka dinding: kecil = menyerempet), kuat, kedip
    - atmosfer (langit, kabut, debu), pasca (grade malam biru + api), grain — aturan modul: techniques.md §7d
  Ganti: isi panel (pustaka.dindingRelief: isi, arah, lebarPanel, seed), jalur SINAR, titik henti kamera, legenda #cap.
  Aturan yang dibayar mahal:
    - nilai MUTLAK di tween SINAR/kamera ('+=' diselesaikan GSAP saat render pertama: bergantung jalur seek)
    - gerak tokoh = data `gerak` (ayun/kembang/geser/alir), fungsi murni tl.time(); SUBTIL (ayun ≤ 10°, geser ≤ 40 px) supaya
      tetap terbaca batu, bukan kartun
    - dinding lebih lebar dari jalur kamera ± setengah frame (ujung dinding tak boleh masuk frame); lebar ≤ batas tekstur GPU
    - jangan menggambar dinding batu dengan filter SVG: filter yang dipanggang tak bisa bergerak, filter yang dianimasikan
      ±358 ms/frame dan tanpa bayangan jatuh. Kanvas relief: ±16–22 ms/frame + capture; setup peta tinggi ±1–2 dtk saat muat
    - langit() SEKALI; partikel total ≤ 400; rig dan pembungkus [data-z] tanpa filter/opacity/mix-blend/clip/mask
  Autoplay + loop, TANPA player; ?debug=1 panel scrub; ?clean=1 untuk export; ?kosong=1 = rig + modul tanpa adegan (uji).
  Buka dengan klik dua kali. Hanya butuh browser + internet (GSAP & font dari CDN). Suara: isi src #vo.
-->

<style>
html,body{margin:0;height:100%;background:#05030a;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:#0a0b14}   /* diposisikan absolut + translate(-50%,-50%): grid center akan terpotong */
#stage svg{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible}   /* kontrak adegan: <svg> bidang meluber keluar frame saat kamera bergeser — jangan dihapus */
.view{position:absolute;inset:0}

#cap{position:absolute;left:128px;bottom:84px;opacity:0;font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-weight:600;color:#f6ead2;
  text-shadow:0 2px 22px rgba(8,4,12,.9),0 0 2px rgba(8,4,12,.5)}
#cap .kick{font-size:34px;letter-spacing:.34em;color:#f0b062}
#cap .ttl{font-size:104px;line-height:1;margin-top:10px;letter-spacing:.01em}

/* panel developer: hanya tampil dengan ?debug=1 */
#dbg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:none;gap:12px;align-items:center;padding:10px 16px;border-radius:14px;
  background:rgba(14,16,22,.9);color:#cfd5e3;font:13px system-ui;z-index:50}
#dbg input{width:360px}#dbg span{font-variant-numeric:tabular-nums;min-width:6ch}

<body>
<div id="stage">
  <!-- view memuat rig #world: bidang [data-z], kabut, partikel, kanvas relief dirakit ke dalamnya oleh galeriRelief(); langit WebGL jadi anak pertama #stage, lapisan grade sesudah view ini -->
  <div id="view" class="view"><div id="world" style="position:absolute;inset:0;transform-origin:0 0"></div></div>
  <div id="vig"></div>
  <div id="ui">
    <!-- legenda dokumenter: di luar rig (tak ikut kamera/paralaks), masuk saat kamera tiba di panel perahu (9,2 → 9,8 dtk), keluar 13 → 13,6 dtk -->
    <div id="cap"><div class="kick">BOROBUDUR · ABAD IX</div><div class="ttl">Kapal Bercadik</div></div>
  </div>
  <div id="dbg"><button id="dPlay">Pause</button><input id="dScrub" type="range" min="0" max="1000" value="0"><span id="dClock">0.00s</span></div>
</div>
<!-- suara opsional: isi src bila ada VO/musik; kosong = diabaikan -->
<audio id="vo" src="" preload="auto"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" integrity="sha384-g4NTh/Iv5PPU4xPyhEWqPcwtNXOvdaDI8LLnyYfyNZOjKJeYQyjzQ9X5275eBjpt" crossorigin="anonymous"></script>
<script>
const W=1920,H=1080,DUR=20;
const $=s=>document.querySelector(s);
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();

const rig=$('#world');
/* <wv:kamera> dibangun dari src/runtime/kamera.js — JANGAN edit di sini;
   ubah sumbernya lalu jalankan: node scripts/build-starters.mjs */
/* KAMERA — satu objek keadaan, fungsi murni dari tl.time() (SKILL.md Hukum #2).
   Inti ini TIDAK menyentuh DOM/WebGL: ia hanya menulis angka ke CAM lewat tween GSAP berdetik
   absolut. Backend (kamera-dom / kamera-three) mendefinisikan applyCam() yang membaca CAM dan
   menggambar. Kosakata: techniques.md §3b. */
const CAM={mode:'dom',          // 'dom' (2.5D) | 'three' — diisi backend
  fx:W/2,fy:H/2,fz:0,           // titik fokus (koordinat dunia)
  zoom:1,                       // 2.5D: skala rig; 3D: camera.zoom
  dist:10,yaw:0,pitch:0,roll:0, // kamera relatif ke fokus (derajat); 2.5D: yaw/pitch kecil = tilt/paralaks
  mm:35,                        // lensa (filmGauge 36); 2.5D: perspective = W*mm/36 px
  focus:0,aperture:0,           // rack focus (aperture 0 = mati)
  shake:0,seed:1,               // handheld: value-noise ber-seed, bukan Math.random
  blur:0};                      // blur berarah saat whip
/* RENCANA: bayangan CAM saat setup. Nilai relatif ('+=220', '*=1.4') diselesaikan DI SINI menjadi angka
   absolut — GSAP menyelesaikan nilai relatif saat tween pertama kali dirender, sehingga hasilnya bergantung
   jalur seek (putar ≠ lompat ≠ worker export). Karena itu gerak relatif wajib dipanggil urut waktu. */
const PLAN={...CAM},P0=W*35/36;let planAt=-Infinity;
const camDefaults=v=>{Object.assign(CAM,v);Object.assign(PLAN,v);};                          // nilai awal dari backend 3D, CAM dan PLAN harus kembar
const mutlak=(at,v)=>{const o={};for(const k in v){let x=v[k];
  if(typeof x==='string'){if(at<planAt)throw new Error('gerak relatif harus dipanggil urut waktu (detik '+at+' setelah '+planAt+')');
    const op=x.slice(0,2),n=parseFloat(x.slice(2));
    if(!['+=','-=','*='].includes(op)||isNaN(n))throw new Error('nilai relatif tidak dikenal: '+k+' '+x+' (pakai +=, -=, *=)');
    x=op==='*='?PLAN[k]*n:op==='-='?PLAN[k]-n:PLAN[k]+n;}
  o[k]=PLAN[k]=x;}planAt=Math.max(planAt,at);return o;};
const camTo=(at,dur,v,ease='power2.inOut')=>tl.to(CAM,{...mutlak(at,v),duration:dur,ease,onUpdate:applyCam},at);
const cutTo=(at,v)=>tl.set(CAM,{...mutlak(at,v),onUpdate:applyCam},at);                       // lompat di titik cut
const camReset=()=>{gsap.killTweensOf(CAM);Object.assign(PLAN,CAM);planAt=-Infinity;};       // buang semua gerak kamera yang sudah ditulis
/* alias kamera KOLASE (explainer.md "Resep kamera kolase") — angka & easing persis yang lama */
const look=(at,x,y,z,dur=1.6,ease='sine.inOut')=>camTo(at,dur,{fx:x,fy:y,zoom:z},ease);     // meluncur ke aset lain
const home=(at,x=W/2,y=H/2,dur=1.2)=>look(at,x,y,1,dur,'power2.inOut');                     // zoom out ke frame adegan, lalu DIAM
const into=(cutAt,x,y,z)=>camTo(cutAt-.9,.9,{fx:x,fy:y,zoom:z},'power2.in');                // push-through sebelum cut
const settle=(cutAt,x,y,z)=>camTo(cutAt,1.1,{fx:x,fy:y,zoom:z*.94},'power3.out');           // mendarat setelah cut
const breath=(a,b,z)=>camTo(a,b-a,{zoom:z},'sine.inOut');                                   // napas halus saat "diam"
/* value-noise 1D ber-seed: hash bilangan bulat → interpolasi smoothstep. Dipakai handheld.
   Bukan Math.random: t yang sama selalu memberi nilai yang sama (scrub & export reproducible). */
const hash=(i,s)=>{let x=(Math.imul(i,374761393)+Math.imul(s,668265263))|0;x=Math.imul(x^x>>>13,1274126177);return((x^x>>>16)>>>0)/4294967296;};
const noise=(t,s=1)=>{const i=Math.floor(t),f=t-i,u=f*f*(3-2*f),a=hash(i,s);return a+(hash(i+1,s)-a)*u;};

/* UKURAN SHOT (techniques.md §3b): berapa bagian frame yang diisi subjek. ECU 6,7× frame … EWS 0,1×. */
const SHOT={ECU:6.7,CU:2.86,MCU:1.67,MS:1.11,WS:.45,EWS:.1};
/* kotak elemen dalam koordinat root (dunia tanpa transform kamera, atau #stage untuk HUD). HTML: rantai
   offset. Elemen tanpa offsetLeft (SVG — bersarang, ber-viewBox, ber-transform): kotak layarnya relatif ke
   root, dibagi skala panggung. ponytail: mengandaikan root belum di-transform kamera — benar saat setup. */
function rectIn(el,root){
  if(typeof el.offsetLeft!=='number'){const a=el.getBoundingClientRect(),b=root.getBoundingClientRect(),k=b.width/root.offsetWidth||1;
    return{x:(a.left-b.left)/k,y:(a.top-b.top)/k,w:a.width/k,h:a.height/k};}
  let x=0,y=0,n=el;while(n&&n!==root){x+=n.offsetLeft;y+=n.offsetTop;n=n.offsetParent;}
  return{x,y,w:el.offsetWidth,h:el.offsetHeight};}
let lastShot=null;
function shot(at,dur,size,el,{ease='power2.inOut',fill=SHOT[size]}={}){
  if(!fill)throw new Error('ukuran shot tidak dikenal: '+size+' (ECU CU MCU MS WS EWS)');
  if(CAM.mode==='three'&&CAM.frame3d){const v=CAM.frame3d(fill,el);CAM.cek3&&CAM.cek3(at,dur,el,v);camTo(at,dur,v,ease);return v;}   // 3D: el = Object3D atau nama, bukan selector DOM
  if(typeof el==='string'){const sel=el;el=$(sel);if(!el)throw new Error('shot: subjek '+sel+' tidak ada');}
  const r=rectIn(el,rig);let cx=r.x+r.w/2,cy=r.y+r.h/2;
  /* subjek di dalam bidang [data-z]: bidang diskalakan (P0-z)/P0 dari pusatnya, jadi titik fokusnya ikut bergeser (tepat di 35 mm) */
  for(let n=el.parentNode;n&&n!==rig;n=n.parentNode)if(n.dataset&&n.dataset.z!=null){
    const p=rectIn(n,rig),s0=(P0-n.dataset.z)/P0,ox=p.x+p.w/2,oy=p.y+p.h/2;cx=ox+s0*(cx-ox);cy=oy+s0*(cy-oy);break;}
  const v={fx:cx,fy:cy,zoom:Math.max(.1,Math.min(6,Math.min(W*fill/r.w,H*fill/r.h)))};
  hud.check(at,dur,r,v);
  if(dur===0&&lastShot&&lastShot.el===el&&lastShot.size===size&&Math.abs(lastShot.yaw-PLAN.yaw)<30)
    console.warn('aturan 30°: cut ke subjek yang sama dengan ukuran '+size+' tanpa beda sudut ≥ 30° terasa jump cut (detik '+at+')');
  lastShot={el,size,yaw:PLAN.yaw};
  camTo(at,dur,v,ease);return v;}

/* SUDUT KAMERA. 2.5D: sudut kecil (dunia pipih); 3D: sudut film sungguhan. */
const ANGLE={
  dom:{eye:{pitch:0,yaw:0,roll:0},high:{pitch:-8},low:{pitch:8},overhead:{pitch:-8,zoom:'*=.8'},worm:{pitch:8,zoom:'*=1.3'},
       dutch:{roll:12},ots:{yaw:6,pitch:-3},pov:{pitch:0,yaw:0,roll:0,shake:.6}},
  three:{eye:{pitch:0,roll:0},high:{pitch:-30},low:{pitch:25,mm:24},overhead:{pitch:-89.9},worm:{pitch:60,mm:16},
         dutch:{roll:15},ots:{yaw:35,pitch:-8,mm:50},pov:{pitch:0,roll:0,mm:28,shake:.5}}};
const angle=(at,dur,name,o={},ease='power2.inOut')=>{const p=ANGLE[CAM.mode][name];
  if(!p)throw new Error('sudut tidak dikenal: '+name+' ('+Object.keys(ANGLE[CAM.mode]).join(' ')+')');
  return camTo(at,dur,{...p,...o},ease);};

/* GERAK — relatif terhadap RENCANA ('+=', '*=' diselesaikan saat setup), jadi bisa dirantai tanpa tahu nilai sebelumnya */
const dolly=(at,dur,k,ease)=>camTo(at,dur,CAM.mode==='three'?{dist:'*='+(1/k)}:{zoom:'*='+k},ease);   // k>1 mendekat
const truck=(at,dur,dx,ease)=>{if(CAM.mode!=='three')return camTo(at,dur,{fx:'+='+dx},ease);
  const y=PLAN.yaw*Math.PI/180;return camTo(at,dur,{fx:'+='+dx*Math.cos(y),fz:'+='+-dx*Math.sin(y)},ease);};   // 3D: geser sepanjang vektor kanan kamera
const pedestal=(at,dur,dy,ease)=>camTo(at,dur,{fy:'+='+dy},ease);                                      // dy>0 = turun (sumbu layar)
const pan=(at,dur,dYaw,ease)=>camTo(at,dur,{yaw:'+='+dYaw},ease);
const tilt=(at,dur,dPitch,ease)=>camTo(at,dur,{pitch:'+='+dPitch},ease);
const crane=(at,dur,{dy=0,dPitch=0}={},ease)=>camTo(at,dur,{fy:'+='+dy,pitch:'+='+dPitch},ease);
let AXIS=null;const rule180=a=>{AXIS=a;};                                                             // garis aksi (yaw); null = bebas
const arc=(at,dur,toYaw,ease='sine.inOut')=>camTo(at,dur,{yaw:AXIS==null?toYaw:Math.max(AXIS-89,Math.min(AXIS+89,toYaw))},ease);
const lens=(at,dur,mm,ease)=>camTo(at,dur,{mm},ease);
/* vertigo. 2.5D: subjek di z=0 tidak terpengaruh perspective, bidang data-z bergeser → cukup tween mm. */
const dollyZoom=(at,dur,mm,ease)=>camTo(at,dur,CAM.mode==='three'?{mm,dist:PLAN.dist*mm/PLAN.mm}:{mm},ease);   // 3D: dist/mm konstan → subjek di fokus tetap sebesar semula
/* whip pan (techniques.md §4c #6; bernama whipPan karena starter aksi kontinu sudah punya whip(t,dari,ke) antar-view): dunia bergeser 180 px + blur 0,28 dtk; panggil cutTo(at+.28, …) untuk shot berikutnya */
const whipPan=(at,dir=1)=>{if(CAM.mode==='three')return camTo(at,.28,{yaw:'+='+(70*dir)},'power2.in');   // 3D: putar yaw, tanpa blur rig
  camTo(at,.28,{fx:'+='+(-180*dir)},'power2.in');cutTo(at,{blur:18});cutTo(at+.28,{blur:0});};
/* handheld: backend memanggil applyCam dari ticker selama CAM.shake ≠ 0, jadi goyangan hidup saat diputar DAN saat seek */
const handheld=(a,b,amp=.5)=>{camTo(a,.3,{shake:amp},'sine.out');camTo(b-.3,.3,{shake:0},'sine.in');};
/* ZONA AMAN HUD: kamera tahu kantong teks, sehingga shot() tidak membawa subjek ke bawah label.
   Elemen di dalam rig = koordinat dunia; di luar rig (HUD #stage) = koordinat layar, dikonversi
   ke dunia memakai kamera shot itu. */
const HUD=[];
const hud={
  reserve(sel,at,dur){const e=$(sel);if(!e)throw new Error('hud.reserve: '+sel+' tidak ada');HUD.push({sel,el:e,at,to:at+dur});},
  check(at,dur,r,v){for(const h of HUD){if(at+dur<h.at||at>h.to)continue;
    const dalam=rig.contains(h.el);let p=rectIn(h.el,dalam?rig:$('#stage'));
    if(!dalam)p={x:(p.x-W/2)/v.zoom+v.fx,y:(p.y-H/2)/v.zoom+v.fy,w:p.w/v.zoom,h:p.h/v.zoom};   // layar → dunia
    if(r.x<p.x+p.w&&r.x+r.w>p.x&&r.y<p.y+p.h&&r.y+r.h>p.y)
      throw new Error('zona aman: subjek shot pada detik '+at+' masuk kantong teks '+h.sel+' — geser fokus, ganti ukuran shot, atau pindahkan teks');}}};

/* posisi kamera dari koordinat bola di sekitar fokus (derajat); pitch negatif = kamera di atas fokus, menunduk */
const pose=c=>{const y=c.yaw*Math.PI/180,p=c.pitch*Math.PI/180;
  return{x:c.fx+c.dist*Math.cos(p)*Math.sin(y),y:c.fy-c.dist*Math.sin(p),z:c.fz+c.dist*Math.cos(p)*Math.cos(y)};};
/* jarak agar subjek h×w mengisi `fill` frame; sisi panjang sensor 36 mm menentukan (filmGauge 36) */
const jarakBingkai=(h,w,fill,mm,aspect=W/H)=>{if(!(Math.max(h,w)>0))throw new Error('jarakBingkai: ukuran subjek 0');
  if(!(fill>0)||!(mm>0))throw new Error('jarakBingkai: fill ('+fill+') dan mm ('+mm+') harus > 0');
  const d=Math.max(h,w/aspect)/fill*mm*Math.max(aspect,1)/36;if(!isFinite(d))throw new Error('jarakBingkai: ukuran subjek 0');return d;};
/* </wv:kamera> */
/* <wv:kamera-dom> dibangun dari src/runtime/kamera-dom.js — JANGAN edit di sini;
   ubah sumbernya lalu jalankan: node scripts/build-starters.mjs */
/* BACKEND 2.5D — membaca CAM, menulis transform ke rig (#world/#colWorld), bidang [data-z], dan
   overlay cahaya. Jalur 2D murni (tanpa pitch/yaw/roll/shake/bidang) memakai string yang PERSIS
   sama dengan kamera kolase lama dan tidak menyentuh gaya lain.
   BIDANG: pembungkus [data-z="-300"] (elemen <div>/<svg> sendiri — transform 3D DI DALAM svg diratakan
   Chrome). GSAP menganimasikan ANAK pembungkus, bukan pembungkusnya. scale((P0-z)/P0) membuat ukuran
   pada lensa 35 mm sama dengan 2D; paralaks muncul saat kamera bergerak/miring, dan lens()/dollyZoom()
   mengubah ukuran bidang relatif terhadap z=0. */
CAM.mode='dom';
const BIDANG=[...rig.querySelectorAll('[data-z]')].map(e=>({el:e,z:+e.dataset.z}));
let blurKu=0;
function applyCam(){
  const P=W*CAM.mm/36;let fx=CAM.fx,fy=CAM.fy,roll=CAM.roll;
  if(CAM.shake){const t=tl.time(),a=CAM.shake;fx+=(noise(t*1.7,CAM.seed)-.5)*40*a;fy+=(noise(t*1.3,CAM.seed+1)-.5)*30*a;roll+=(noise(t*.9,CAM.seed+2)-.5)*1.2*a;}
  if(!CAM.pitch&&!CAM.yaw&&!roll&&!CAM.shake&&!BIDANG.length)
    rig.style.transform=`translate(${W/2-CAM.fx*CAM.zoom}px,${H/2-CAM.fy*CAM.zoom}px) scale(${CAM.zoom})`;
  else rig.style.transform=`translate(${W/2}px,${H/2}px) perspective(${P}px) rotateX(${CAM.pitch}deg) rotateY(${CAM.yaw}deg) rotateZ(${roll}deg) scale(${CAM.zoom}) translate(${-fx}px,${-fy}px)`;
  if(BIDANG.length)rig.style.transformStyle='preserve-3d';
  for(const b of BIDANG){b.el.style.transform=`translateZ(${b.z}px) scale(${(P0-b.z)/P0})`;
    b.el.style.filter=CAM.aperture?`blur(${Math.min(24,Math.abs(b.z-CAM.focus)*CAM.aperture/100).toFixed(2)}px)`:'';}
  if(CAM.blur||blurKu){rig.style.filter=CAM.blur?`blur(${CAM.blur}px)`:'';blurKu=CAM.blur;}}   // hanya filter milik kamera yang dihapus
gsap.ticker.add(()=>{if(CAM.shake)applyCam();});   // handheld/pov: noise dibaca dari tl.time() tiap frame, bukan hanya saat ada tween CAM
/* rack focus: fokus = z bidang yang berisi subjek; aperture>0 mengaburkan bidang lain sebanding jaraknya */
const bidangDari=el=>{if(typeof el==='string'){const sel=el;el=$(sel);if(!el)throw new Error('focus: subjek '+sel+' tidak ada');}
  for(let n=el;n&&n!==rig;n=n.parentNode)if(n.dataset&&n.dataset.z!=null)return +n.dataset.z;return 0;};
const focus=(at,dur,el,aperture=6,ease='sine.inOut')=>camTo(at,dur,{focus:bidangDari(el),aperture},ease);
const rackFocus=(at,dur,a,b)=>{cutTo(at,{focus:bidangDari(a),aperture:6});focus(at,dur,b);};

/* CAHAYA 2.5D: overlay gradien di atas rig. Dua div bergantian supaya pergantian bisa di-tween.
   ponytail: urutan panggilan = urutan waktu — light() dengan 'at' lebih kecil dari panggilan sebelumnya ditolak. */
const CAHAYA={
  day:   {bg:'none',blend:'normal',op:0},

/* ATMOSFER (spec sub-proyek 2 §4.1) — langit WebGL di belakang dunia, kabut per bidang, partikel ber-seed.
   Semua keadaan = fungsi murni tl.time() + seed (tanpa akumulasi), jadi putar = scrub = ekspor. Yang berat
   dipanggang sekali saat setup; per frame hanya satu draw shader, transform kabut, dan satu kanvas partikel.
   Membaca CAM bila ada (starter panggung belum punya). Tidak dipanggil = halaman tidak berubah sedikit pun. */

/* jam bersama: rantai tl.eventCallback('onUpdate') seperti grainHidup — callback lama tetap dipanggil. Rantai tidak
   bisa diurai, jadi callback milik elemen yang sudah dilepas dari DOM harus jadi no-op sendiri (cek isConnected). */
function rantaiUpdate(fn){const prev=tl.eventCallback('onUpdate');
  tl.eventCallback('onUpdate',function(){if(prev)prev.apply(this,arguments);fn();});}
/* acak ber-seed. Idenya sama dengan hash/noise kamera.js, namanya beda: di sana const (bentrok = SyntaxError) dan
   starter panggung tidak memuat kamera.js */

const rigDunia=()=>typeof rig!=='undefined'?rig:$('#world');
/* view = anak #stage yang memuat rig (#collage di aksi kontinu; di panggung rig-nya sendiri, #world) */
const viewDunia=()=>{const st=$('#stage');let a=rigDunia();while(a.parentNode!==st)a=a.parentNode;return a;};
/* lapisan di atas dunia, di bawah #vig/#ui: sesudah anak #stage yang memuat rig — bukan di dalam rig/bidang, jadi
   tidak meratakan paralaks. Bertumpuk urut panggilan: lapisan baru di atas lapisan depan sebelumnya (ditandai
   data-wv-depan), tetap di bawah anak #stage lain. Lapisan depan hidup DI LUAR view rig: di starter aksi kontinu ia
   tetap terlihat walau #collage .view.off — sembunyikan/lepas sendiri saat ganti view. */
function lapisDepan(el){let a=viewDunia();
  while(a.nextElementSibling&&a.nextElementSibling.hasAttribute('data-wv-depan'))a=a.nextElementSibling;
  el.setAttribute('data-wv-depan','');a.after(el);return el;}
/* '#rgb' | '#rrggbb' | 'rgb(a)(…)' (bentuk yang ditulis GSAP saat men-tween warna) → [r,g,b] 0..255 */
const warnaRGB=c=>{c=String(c).trim();if(c[0]==='#'){if(c.length<6)c='#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];const n=parseInt(c.slice(1,7),16);return[n>>16&255,n>>8&255,n&255];}
  const m=c.match(/[\d.]+/g);if(!/^rgb/.test(c)||!m||m.length<3)throw new Error('warna tidak dikenal: '+c+' (pakai #rrggbb atau rgb())');return m.slice(0,3).map(Number);};

/* LANGIT — di-tween GSAP seperti CAM: tl.to(LANGIT,{matahariY:.8},at). Posisi 0..1 (y = 0 di atas), matahariR dalam
   tinggi frame, pendar/bintang/awan/sinar 0..1 (0 = mati; bintang/awan/sinar 0 dilewati shader), hanyut = px/dtk awan.
   Bawaan: malam ungu berbulan (acuan evals/bukti/2026-11-01-spike-gapura/f_7.jpg). */
const LANGIT={zenit:'#0d0b24',tengah:'#2e2452',horizon:'#7c5679',matahariX:.72,matahariY:.2,matahariR:.03,
  warnaMatahari:'#ffe9c8',pendar:.45,bintang:.6,awan:.55,awanWarna:'#4a3f6e',hanyut:9,sinar:.2};
/* satu fragment shader (bahan: riset gl-shader.html pass 1–2): gradien 3 warna, cakram + pendar, bintang hash
   berkelip, awan fBm 5 oktaf yang hanyut. God rays analitik: berkas = noise menurut ARAH dari matahari, diredam awan
   yang disampel di 2 titik ke arah matahari (fBm 1 oktaf + rata-rata oktaf yang hilang). Radial blur 16–24 sampel
   terukur +20–50 ms/frame di HD 4000; versi ini ±5 ms, seluruh langit ±12–15 ms. Siluet SVG di depan kanvas
   menutup berkasnya sendiri — tanpa pre-pass. */
const LANGIT_FS=`#version 300 es
precision highp float;uniform vec2 R;uniform float T;uniform vec3 Z,M,Hz,Sc,Ac,C;uniform vec4 S,A;out vec4 o;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}

float tutup(float f,float w){float lo=.7-.45*A.y;return smoothstep(lo,lo+w,f);}
void main(){vec2 c=R*.5,p=vec2(gl_FragCoord.x,R.y-gl_FragCoord.y)-c;float cr=cos(C.z),sr=sin(C.z);

 vec2 s=S.xy*R;float d=length(p-s)/R.y,g=S.w*(.55*exp(-max(d-S.z,0.)*30.)+.3*exp(-d*4.5));
 if(A.x>0.){vec2 q=floor(p/12.),e=p-q*12.-2.;float r1=h(q),r2=h(q+19.7),r3=h(q+53.3);
  if(r1<.03*A.x)col+=vec3(1.,.95,.86)*(.3+.7*r3*r3)*(.65+.35*sin(T*(1.2+3.*r2)+r3*40.))
   *(1.-smoothstep(.3+.7*r2,1.3+.7*r2,length(e-vec2(r2,r3)*8.)))*(1.-smoothstep(.25,.8,y));}
 col+=Sc*g;col=mix(col,Sc,1.-smoothstep(S.z-1.5/R.y,S.z,d));
 if(A.y>0.){float f=fbm(p,5);col=mix(col,Ac*(.55+.8*tutup(f,.55))+Sc*g*1.3,tutup(f,.25)*.9);}

   bebas=1.-.8*tutup(.5*(fbm(s+v*min(.12,d)*R.y,1)+fbm(s+v*min(.3,d)*R.y,1)),.25);

/* langit(opsi) → kanvas #wv-langit, anak PERTAMA #stage (di belakang dunia, bukan di dalamnya: langit di tak hingga).
   opsi ditimpakan ke LANGIT. Kamera: uv diputar CAM.roll di pusat frame dan digeser (CAM.fx/fy − pusat)·0,02 px;
   guncangan handheld tidak diikutkan (±0,7° tak terlihat di langit). Digambar ulang hanya lewat onUpdate tl, yang
   terpicu hanya saat tl.time() berubah. Tanpa WebGL2: <div> gradien CSS + console.warn. Panggilan kedua mengganti. */

  const gl=c.getContext('webgl2',{alpha:false,antialias:false,preserveDrawingBuffer:true}),pr=gl&&gl.createProgram();
  if(pr){const sh=[[gl.VERTEX_SHADER,'#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0,1);}'],[gl.FRAGMENT_SHADER,LANGIT_FS]].map(([t,src])=>{

  if(!pr||!gl.getProgramParameter(pr,gl.LINK_STATUS)){
    if(!pr)console.warn('langit: WebGL2 tidak tersedia — jatuh ke gradien CSS (tanpa bintang, awan, sinar)');
    const d=document.createElement('div');d.id='wv-langit';
    d.style.cssText=`position:absolute;inset:0;pointer-events:none;background:linear-gradient(${L.zenit},${L.tengah},${L.horizon})`;st.prepend(d);return d;}
  c.style.cssText='position:absolute;left:0;top:0;pointer-events:none';st.prepend(c);
  gl.useProgram(pr);gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);

    gl.uniform1f(U.T,t);gl.uniform4f(U.S,L.matahariX,L.matahariY,L.matahariR,L.pendar);gl.uniform4f(U.A,L.bintang,L.awan,t*L.hanyut,L.sinar);

  gambar();rantaiUpdate(gambar);return c;}
/* perspektif udara: campur warna ke LANGIT.horizon sebanding z/zJauh (0..1) — bidang makin jauh, makin pudar */
function warnaJarak(warna,z,zJauh=-800){const k=Math.max(0,Math.min(1,z/zJauh)),a=warnaRGB(warna),b=warnaRGB(LANGIT.horizon);

/* kabut(bidang,{y,…}) → <div class="wv-kabut"> anak bidang (ikut paralaks). Tile fBm 2D ber-seed lebar×tebal
   dipanggang SEKALI (kisi berperiode → menyambung di tepi; alfa memudar ke atas/bawah), ditampilkan sebagai
   background repeat-x; per frame hanya translateX dari t. y = garis tengah pita (px bidang). Bidang jauh: rapat
   lebih besar + warna warnaJarak(…, z). Elemen = 3 tile mulai x −lebar/2: di SETIAP fase hanyut pita menutup
   [−lebar/2, 3·lebar/2] bidangnya, jadi kamera boleh bergeser ±lebar/2 (truck, zoom < 1, roll, handheld) tanpa
   ujung pita masuk frame. */
function kabut(bidang,{y,tebal=180,warna=LANGIT.horizon,rapat=.6,hanyut=20,seed=1,lebar=W}={}){
  if(!(bidang instanceof HTMLElement))throw new Error('kabut: bidang wajib elemen HTML (bukan <g> SVG)');
  if(y==null)throw new Error('kabut: y (garis tengah pita, px bidang) wajib');
  const c=document.createElement('canvas');c.width=lebar;c.height=tebal;
  const x=c.getContext('2d'),im=x.createImageData(lebar,tebal),d=im.data,[r,g,b]=warnaRGB(warna),p0=Math.max(1,Math.round(lebar/300)),S=new Float32Array(lebar*tebal);
  /* fBm 2D 5 oktaf (sel pertama ±300×60 px): tiap baris kisi = vnoise 1D ber-seed sendiri, dihitung SEKALI per baris
     (bukan per piksel), lalu diinterpolasi halus antarbaris. Loop polos: ±40 ms untuk 1920×180. */
  for(let k=0;k<5;k++){const fy=2**k/60,a=.5**(k+1),p=p0*2**k,R=[];
    for(let j=0;j<=tebal*fy+1;j++){const q=R[j]=new Float32Array(lebar);for(let i=0;i<lebar;i++)q[i]=vnoise(i*p/lebar,seed*7+k+j*7919,p);}
    for(let j=0;j<tebal;j++){const v=j*fy,q=Math.floor(v),w=v-q,e=w*w*(3-2*w),u=R[q],z=R[q+1];for(let i=0;i<lebar;i++)S[j*lebar+i]+=a*(u[i]+(z[i]-u[i])*e);}}
  for(let j=0;j<tebal;j++){const tepi=Math.sin(Math.PI*(j+.5)/tebal)**1.5;   // memudar ke atas/bawah
    for(let i=0;i<lebar;i++){const o=(j*lebar+i)*4;d[o]=r;d[o+1]=g;d[o+2]=b;d[o+3]=255*rapat*tepi*(.2+.8*Math.min(1,Math.max(0,S[o/4]*2.6-1.05)));}}   // kabut tipis + gumpalan
  x.putImageData(im,0,0);
  const el=document.createElement('div');el.className='wv-kabut';
  el.style.cssText=`position:absolute;left:${-lebar/2}px;top:${y-tebal/2}px;width:${3*lebar}px;height:${tebal}px;pointer-events:none;will-change:transform;`+
    `background:url("${c.toDataURL()}") repeat-x;background-size:${lebar}px ${tebal}px`;
  bidang.appendChild(el);
  const geser=()=>{if(el.isConnected)el.style.transform=`translateX(${-(((tl.time()*hanyut)%lebar+lebar)%lebar)}px)`;};
  geser();rantaiUpdate(geser);return el;}

/* PARTIKEL — satu kanvas 2D seukuran area per panggilan. Tiap partikel punya r[] dari mulberry32(seed) saat setup;
   tiap frame fase = frac(t/umur + r), posisi/alfa = fungsi (r, fase) saja → seek ke mana pun memberi piksel sama.
   gerak(r,f,w,h) → [x, y, jari sprite, alfa]; alfa 0 di fase 0 dan 1 (atau gerak periodik) → tidak ada lompatan. */
const JENIS_PARTIKEL={
  bara:{umur:[2.4,5],warna:'#ff9a3c',aditif:1,     // naik berkelok dari dasar area, berkedip, memudar
    gerak:(r,f,w,h)=>[r[1]*w+Math.sin(6.283*(f*(1+r[2])+r[3]))*(10+30*r[4])*f,h*(1-f*(.55+.45*r[5])),(1.2+2*r[4])*(1-.4*f)*3,Math.min(1,f*8)*(1-f)*(.7+.3*Math.sin(f*70+r[3]*9))]},
  debu:{umur:[8,16],warna:'#ffe6c0',aditif:1,      // melayang lambat di berkas cahaya
    gerak:(r,f,w,h)=>[r[1]*w+(f-.5)*(30+50*r[2])*(r[6]<.5?-1:1)+4*Math.sin(6.283*(2*f+r[3])),r[5]*h+(f-.5)*(20*r[4]-10)+3*Math.sin(6.283*(3*f+r[2])),(.8+1.2*r[4])*2.5,Math.sin(Math.PI*f)*(.2+.4*r[2])]},
  asap:{umur:[6,10],warna:'#8c7c8c',               // gumpalan radial besar, naik & melebar, alfa ≤ .12
    gerak:(r,f,w,h)=>[r[1]*w+f*(r[2]-.5)*80,h*(1-f*(.4+.5*r[3])),(40+50*r[4])*(1+1.4*f),.12*Math.sin(Math.PI*f)*(.5+.5*r[5])]},
  kunang:{umur:[3,6],warna:'#d6ff7a',aditif:1,     // nyaris diam, berkedip; gerak periodik penuh per umur
    gerak:(r,f,w,h)=>[r[1]*w+18*Math.sin(6.283*(f+r[2])),r[3]*h+12*Math.sin(6.283*(2*f+r[4])),(1.5+1.5*r[5])*3,Math.max(0,Math.sin(6.283*(2*f+r[6])))**6]}};
/* partikel(bidang | 'depan', {jenis,…}) → <canvas class="wv-partikel"> di (area[0], area[1]) bidang itu; 'depan' =
   lapisDepan (koordinat #stage). Jepitan 400 PER PANGGILAN; total per HALAMAN dijaga pemanggil: callback partikel/kabut/sumber menggambar tiap
   frame, tersembunyi atau di luar frame sekalipun. */
function partikel(bidang,{jenis,n=60,area=[0,0,W,H],seed=1,warna}={}){
  if(bidang!=='depan'&&!(bidang instanceof HTMLElement))throw new Error("partikel: bidang wajib elemen HTML (bukan <g> SVG) atau 'depan'");
  const J=JENIS_PARTIKEL[jenis];if(!J)throw new Error('partikel: jenis tidak dikenal: '+jenis+' ('+Object.keys(JENIS_PARTIKEL).join(' ')+')');
  if(n>400){console.warn('partikel: n '+n+' melewati jepitan 400 per panggilan — dijepit ke 400 (total di halaman dijaga pemanggil)');n=400;}
  const [ax,ay,w,h]=area,cv=document.createElement('canvas');cv.className='wv-partikel';cv.width=w;cv.height=h;
  cv.style.cssText=`position:absolute;left:${ax}px;top:${ay}px;pointer-events:none`;

  const sp=document.createElement('canvas');sp.width=sp.height=64;const sx=sp.getContext('2d'),gr=sx.createRadialGradient(32,32,0,32,32,32),
    [cr,cg,cb]=warnaRGB(warna||J.warna),ca=a=>`rgba(${cr},${cg},${cb},${a})`;
  if(J.aditif)gr.addColorStop(0,'rgba(255,250,235,1)');   // inti panas
  gr.addColorStop(J.aditif?.18:0,ca(1));gr.addColorStop(.45,ca(J.aditif?.3:.5));gr.addColorStop(1,ca(0));sx.fillStyle=gr;sx.fillRect(0,0,64,64);
  const cx=cv.getContext('2d'),rnd=mulberry32(seed),P=Array.from({length:n},()=>{const r=Array.from({length:8},rnd);r[0]=J.umur[0]+(J.umur[1]-J.umur[0])*r[0];return r;});
  cx.globalCompositeOperation=J.aditif?'lighter':'source-over';
  if(bidang==='depan')lapisDepan(cv);else bidang.appendChild(cv);
  const gambar=()=>{if(!cv.isConnected)return;const t=tl.time();cx.clearRect(0,0,w,h);
    for(const r of P){const k=t/r[0]+r[7],[x,y,s,a]=J.gerak(r,k-Math.floor(k),w,h);
      if(a>.003){cx.globalAlpha=Math.min(1,a);cx.drawImage(sp,x-s,y-s,2*s,2*s);}}};
  gambar();rantaiUpdate(gambar);return cv;}

/* CAHAYA-2D (spec sub-proyek 2 §4.2) — cahaya bersumber untuk adegan SVG: pendar berkedip, gelap yang meredup
   menjauhi sumber, rim pada siluet, bayangan jatuh, relief. Filter dan mask DIPANGGANG sekali saat dipanggil —
   atributnya tidak pernah ditulis lagi; per frame hanya opacity/scale pendar (lapisan sendiri, will-change).
   x, y sumber = px bidang = satuan pengguna svg bidang (<svg viewBox="0 0 1920 1080"> di 0,0 bidangnya). Sumber yang
   pindah: geser pendar-nya (tl.to(SUMBER.obor.el,{x:…})); rim/redup/relief dipasang ulang di cut. Membaca tl saat
   dipanggil saja — tidak dipanggil = halaman tidak berubah sedikit pun.
   Kamera yang men-zoom (dolly) mengubah skala bidang tiap frame → Chrome me-raster ulang svg-nya dan filter yang
   dipanggang ikut dihitung ulang (adegan uji: +125–170 ms/frame). Beri <svg> bidang ber-filter will-change:transform:
   bitmap-nya diskalakan, bukan di-raster ulang (terukur ≈ biaya tanpa modul; lunaknya tak terlihat di zoom 1,25).
   Butuh dari atmosfer: rantaiUpdate, vnoise, warnaRGB (hook uji: rigDunia). */

/* SUMBER: nama → {x, y, bidang, warna, jangkau, kuat, kedip, el}. kuat/kedip dibaca tiap frame, jadi boleh di-tween
   seperti CAM: tl.to(SUMBER.obor1,{kuat:0},at) memadamkan obor. */
const SUMBER={};

const defsSVG=svg=>svg.querySelector(':scope>defs')||svg.insertBefore(elSVG('defs'),svg.firstChild);
const ambilSumber=n=>{if(Object.hasOwn(SUMBER,n))return SUMBER[n];throw new Error('cahaya-2d: sumber tidak dikenal: '+n+' ('+Object.keys(SUMBER).join(' ')+')');};
/* kotak kosong = el belum dirender (mis. adegan display:none): filter akan terpotong habis tanpa tanda — tolak */
const kotakEl=el=>{const b=el.getBBox();if(!b.width&&!b.height)throw new Error('cahaya-2d: kotak elemen kosong — el belum dirender (display:none?)');return b;};
/* getCTM() memberi SVGMatrix (tanpa transformPoint) — jadikan DOMMatrix */
const ctmEl=el=>DOMMatrix.fromMatrix(el.getCTM());

function filterCahaya(el,b,m,isi){const f=elSVG('filter',{id:'wv-cahaya-'+(++cahayaN),filterUnits:'userSpaceOnUse',

/* sumber(nama,{x,y,bidang,…}) → <div class="wv-pendar"> di bidang (elemen HTML: <div data-z> atau anaknya): gradien

  if(x==null||y==null||!(bidang instanceof HTMLElement))throw new Error('sumber: x, y (px bidang) dan bidang (elemen HTML, bukan <g> SVG) wajib');

/* Arah dihitung di ruang lokal el (feOffset/skew/fePointLight bekerja di ruang pengguna el, jadi grup yang dicerminkan

/* opsi asing ditolak; angka hingga (POSITIF > 0); larik = pilihan (bawaan pertama); null = opsional */
function opsi(n,D,o={}){
  if(!o||typeof o!=='object'||Array.isArray(o))salah(n,'opsi harus objek {…}');
  for(const k in o)if(!(k in D))salah(n,`opsi tidak dikenal: ${k} (${Object.keys(D).join(' ')})`);
  const r={};for(const k in D){const d=D[k],v=o[k]===undefined?(Array.isArray(d)?d[0]:d):o[k];
    if(Array.isArray(d)){if(!d.includes(v))salah(n,`${k} tidak dikenal: ${v} (${d.join(' ')})`);}
    else if(typeof d==='number'){if(typeof v!=='number'||!isFinite(v))salah(n,`${k} harus angka (dapat ${v})`);
      if(POSITIF.includes(k)&&!(v>0))salah(n,`${k} harus > 0 (dapat ${v})`);}
    else if(v!=null&&k==='detail'&&![0,1,2].includes(v))salah(n,`detail harus 0, 1, atau 2 (dapat ${v})`);
    else if(v!=null&&k==='warna')[].concat(v).forEach(w=>cekWarna(n,k,w));
    else if(v!=null&&k==='id'&&!/^[A-Za-z][\w-]*$/.test(v))salah(n,`id diawali huruf; hanya huruf, angka, - dan _ (dapat ${v})`);
    r[k]=v;}
  return r;}
/* → vektor satuan ke cahaya, warna, kuat */
function lampu(n,c,cx,cy,c0){
  if(c==null)c=c0||{arah:235};
  if(typeof c==='string'){if(typeof ambilSumber!=='function')salah(n,`cahaya '${c}' butuh blok cahaya-2d (SUMBER)`);
    const s=ambilSumber(c);c={x:s.x,y:s.y,warna:s.warna,jangkau:s.jangkau,kuat:min(1,s.kuat??1)};}
  if(typeof c!=='object')salah(n,`cahaya harus nama SUMBER, {x,y} atau {arah} (dapat ${c})`);
  for(const k in c)if(!['x','y','arah','warna','jangkau','kuat'].includes(k))salah(n,`cahaya: kunci tidak dikenal: ${k} (x y arah warna jangkau kuat)`);
  const t=c.x!=null||c.y!=null;
  if(t?![c.x,c.y].every(Number.isFinite):!Number.isFinite(c.arah))salah(n,'cahaya harus {x,y} (angka, px bidang) atau {arah} (angka, derajat)');
  const a=t?atan2(c.y-cy,c.x-cx):c.arah*P/180,d=t?hypot(c.x-cx,c.y-cy):0;

  return{x:cos(a),y:sin(a),w:cekWarna(n,'cahaya.warna',c.warna||LANGIT.warnaMatahari),k:(c.kuat??.75)*(c.jangkau?max(.3,min(1,1.6-d/(1.6*c.jangkau))):1)};}
/* skala, detail, cahaya, nada warna, id */
function siap(n,o,bahan,c0){const L=lampu(n,o.cahaya,o.x,o.y-o.tinggi/2,c0),J=c=>warnaJarak(c,o.jarak,-2000),b=[].concat(o.warna||bahan)[0],t=campur(b,L.w,.24*L.k);

/* rim = siluet digeser ke cahaya, badan bergradien, lapisan K (S siluet, G bayang, L lis, T terang, D gelap, U sorot) */
function rakit(n,o,A,K,{tekstur,ekstra='',isi=''}={}){

  return`<g id="${id}" class="wv-pustaka" data-pustaka="${n}" transform="${T}"><defs><path id="${id}-s" d="${K.S}"/>`+
    `<linearGradient id="${id}-v" x1="${g(L.x)}" y1="${g(L.y)}" x2="${g(-L.x)}" y2="${g(-L.y)}">${stop(0,N.terang)+stop(.45,N.dasar)+stop(1,N.gelap)}</linearGradient>`+

    `${ekstra}</defs><use href="#${id}-s" fill="${N.rim}" transform="translate(${f(L.x*rw)},${f(L.y*rw)})"/><use href="#${id}-s" fill="url(#${id}-v)"/>`+
    (tekstur?`<use href="#${id}-s" fill="url(#${id}-t)" opacity=".45"/>`:'')+lap(K.G,N.gelap,.6)+lap(K.L,N.lis)+lap(K.T,N.terang)+lap(K.D,N.gelap)+lap(K.U,N.terang)+isi+'</g>';}

  /* blok [x,y,w,h,lis]: sisi atas + sisi ke cahaya = lis; lis membayangi dinding di bawahnya */

/* candi: andesit = Mataram Kuno, bata = Majapahit */

/* gunung berlapis: lapis jauh = gunung api, dekat = bukit; kaki berkabut */

/* sawah: petak air memantulkan langit / petak tanam, pematang, kilau */
function sawahTerasering(o){o=opsi('sawahTerasering',{x:960,y:1080,lebar:1800,tinggi:380,baris:9,...OPS},o);
  const A=siap('sawahTerasering',o,'#1d261f'),{s,R,dt,N,id}=A,Wl=o.lebar/s/2,n=round(o.baris),sd=o.seed*13,xs=[],
    pc=x=>-1000*(.62+.38*vnoise(x*s/480,sd))*(1-.8*(abs(x)/Wl)**2.5),   // skala derau dalam px: halus di ukuran berapa pun
    e=(k,x)=>k?pc(x)*(k/n)**1.25+(k<n?(6*sin(x*s/110+k*1.7)+8*(vnoise(x*s/120,sd+k)-.5))/s:0):0,
    air=campur(LANGIT.horizon,LANGIT.tengah,.25),J=c=>warnaJarak(c,o.jarak,-2000),
    kv=p=>p.slice(1,-1).map((q,i)=>'Q'+tk(...q)+' '+tk((q[0]+p[i+2][0])/2,(q[1]+p[i+2][1])/2)).join('')+'L'+tk(...p[p.length-1]),   // kurva halus lewat titik tengah
    gs=(p,c,w,op)=>`<path d="M${tk(...p[0])+kv(p)}" fill="none" stroke="${c}" stroke-width="${f(w/s)}"${op?` opacity="${op}"`:''}/>`;
  for(let x=-Wl;x<=Wl;x+=[80,52,36][dt]/s)xs.push(x);
  const K=lapis();let isi='';K.S=poly(xs.map(x=>[x,pc(x)]).concat([[Wl,40],[-Wl,40]]));
  for(let k=0;k<n;k++){const a=xs.map(x=>[x,e(k+1,x)]),b=xs.map(x=>[x,e(k,x)]).reverse(),bj=R()<.6;   // petak air (memantulkan langit) / tanam
    isi+=`<path d="M${tk(...a[0])+kv(a)}L${tk(...b[0])+kv(b)}Z" fill="${bj?`url(#${id}-a)`:dt?`url(#${id}-p)`:N.dasar}"/>`+gs(b,N.gelap,3.4-2*k/n)+(bj?gs(a,N.rim,1.5,(.55-.3*k/n).toFixed(2)):'');}

    `<pattern id="${id}-p" patternUnits="userSpaceOnUse" width="${f(11/s)}" height="${f(9/s)}"><rect width="${f(11/s)}" height="${f(9/s)}" fill="${N.dasar}"/><rect width="${f(2/s)}" height="${f(5/s)}" fill="${N.gelap}" opacity=".7"/></pattern>`});}

  warnaAsap=o=>warnaJarak(o.warna||campur(LANGIT.horizon,'#6a6070',.55),o.jarak,-2000),
  kanvas=(n,bd,X,Y,w,h,kelas,blend)=>{if(!(bd instanceof HTMLElement))salah(n,'bidang wajib elemen HTML (<div data-z> atau anaknya), bukan <g> SVG');
    const c=document.createElement('canvas');c.className=kelas;c.width=ceil(w);c.height=ceil(h);
    c.style.cssText=`position:absolute;left:${f(X)}px;top:${f(Y)}px;pointer-events:none${blend?';mix-blend-mode:'+blend:''}`;bd.appendChild(c);return c;};
function api(bidang,titik,o={}){

    c=kanvas('api',bidang,X,Y,max(...xs)-X+m,max(...ys)-Y+m*.5,'wv-api','screen'),x=c.getContext('2d');

  const R=mulberry32(o.seed),r=(a,b)=>a+(b-a)*R(),L=lampu('asap',o.cahaya,o.x,o.y-o.tinggi/2),c=warnaAsap(o),

    g+=`<ellipse cx="${f(o.angin*1000*t**1.5+r(-40,40)*t)}" cy="${f(-1000*t)}" rx="${f(rad*r(.95,1.3))}" ry="${f(rad*r(.7,.95))}" fill="url(#${id}-r)" opacity="${(.6*(1-t)**1.3+.05).toFixed(2)}"/>`;}
  return`<g id="${id}" class="wv-pustaka" data-pustaka="asap" transform="translate(${f(o.x)},${f(o.y)}) scale(${+(o.tinggi/1000).toFixed(4)})"><defs><radialGradient id="${id}-r" fx="${(.5+.3*L.x).toFixed(2)}" fy="${(.5+.3*L.y).toFixed(2)}">`+
    stop(0,campur(c,L.w,.35),.6)+stop(.6,c,.26)+stop(1,c,0)+`</radialGradient></defs>${g}</g>`;}
function asapHidup(bidang,o={}){o=opsi('asapHidup',{x:960,y:600,tinggi:400,angin:.35,n:14,seed:1,jarak:0,warna:null},o);
  const H=o.tinggi,m=H*.32,dx=o.angin*H,X=o.x-m+min(0,dx),Y=o.y-H-m,c=kanvas('asapHidup',bidang,X,Y,2*m+abs(dx),H+m*1.3,'wv-asap'),
    x=c.getContext('2d'),sp=document.createElement('canvas'),sx=sp.getContext('2d'),gr=sx.createRadialGradient(32,32,0,32,32,32),
    w=warnaRGB(warnaAsap(o)).join(),rnd=mulberry32(o.seed),
    G=Array.from({length:min(60,round(o.n))},()=>Array.from({length:5},rnd));
  sp.width=sp.height=64;gr.addColorStop(0,`rgba(${w},.5)`);gr.addColorStop(.5,`rgba(${w},.2)`);gr.addColorStop(1,`rgba(${w},0)`);sx.fillStyle=gr;sx.fillRect(0,0,64,64);
  const gambar=()=>{if(!c.isConnected)return;const t=tl.time();x.clearRect(0,0,c.width,c.height);
    for(const g of G){const k=t/(6+4*g[0])+g[1],p=k-floor(k),rad=(.04+.26*p)*H*(.8+.4*g[2]),a=min(1,p*6)*(1-p)**1.3*(.5+.5*g[4]);
      if(a>.004){x.globalAlpha=a;x.drawImage(sp,o.x-X+dx*p**1.5+sin(6.283*(p+g[3]))*H*.03*p-rad,o.y-Y-H*p-rad,2*rad,2*rad);}}};
  gambar();rantaiUpdate(gambar);return c;}

    pohon=(x,y,h)=>{I+=sim([[0,-.18*h],[.16*h,-.12*h],[.1*h,0]],x,y)+ruas([[x,y-.15*h],[x,y-.82*h]],.07*h,.04*h)+sim([[0,-h],[.3*h,-.86*h],[.26*h,-.8*h]],x,y);
      for(let i=0;i<3;i++)for(const sg of SG){const sx=x+sg*(.15+.05*i)*h,sy=y-(.34+.17*i)*h;I+=ruas(qb([x,sy+.06*h],[x+sg*.04*h,sy-.04*h],[sx,sy],4),.035*h,.02*h)+spiral(sx,sy,.1*h*(1-.15*i),1.6,sg);}};
  if(!dt);else if(o.isi==='prosesi'){pohon(-w+190,Y,700);const n=max(2,floor((2*w-420)/170));
    for(let i=0;i<n;i++){const x=-w+380+(i+r(-.15,.15))*(2*w-520)/max(1,n-1),u=5.6*r(.88,1.04);sosok(x,Y,100*u,1,[1,0,2,1,0][i%5]);

    for(let i=0;i<3;i++)sosok(-w*.36+i*w*.22,-470,230,1,i%2);

  const u=(i,c,k)=>`<use href="#${id}-${i}" fill="${c}" transform="translate(${f(L.x*9*k)},${f(L.y*9*k)})"/>`,tb=i=>u(i,N.terang,1)+u(i,N.gelap,-1)+u(i,campur(N.dasar,N.terang,.45),0);

/* ---- RELIEF HIDUP: dindingRelief() = DATA pahatan (bukan SVG) untuk reliefHidup() (src/runtime/relief-hidup.js;

    return gp(p,p.map((_,i)=>k*r*(.34-.26*i/(p.length-1))));},
  ISI_R=['prosesi','perahu','kalpataru'],

    pikul:{pg:.47,cd:3,kd:[14,2],kj:[-12,-20],ld:[40,170],lj:[24,46]},tunjuk:{pg:.47,cd:-1,kd:[10,0],kj:[-10,-16],ld:[96,100],lj:[14,30]},
    sembah:{pg:.13,cd:6,kd:[72,270],kj:[68,268],ld:[60,200],lj:[56,196]},duduk:{pg:.16,cd:0,kd:[84,264],kj:[80,276],ld:[26,82],lj:[34,150]},

/* sosok: (x, y) = telapak di tanah; t = tinggi berdiri px; s = 1 menghadap kanan, −1 kiri; z = tinggi pahatan badan. Tubuh berisi

      `C${n1(x+26*k)},${n1(y-60*k)} ${n1(x+37*k)},${n1(y-36*k)} ${n1(x+35*k)},${n1(y-8*k)} L${n1(x+40*k)},${n1(y-8*k)} L${n1(x+40*k)},${y}Z `+
      `M${n1(x-9*k)},${n1(y-61*k)} H${n1(x+9*k)} V${n1(y-74*k)} H${n1(x-9*k)}Z M${n1(x-3*k)},${n1(y-74*k)} L${x},${n1(y-100*k)} L${n1(x+3*k)},${n1(y-74*k)}Z `;
  langit({zenit:'#070a1c',tengah:'#17213f',horizon:'#46506e',matahariX:.14,matahariY:.08,matahariR:.016,warnaMatahari:'#dfe6ff',pendar:.22,bintang:.55,
    awan:.4,awanWarna:'#222b4a',hanyut:4,sinar:0});

  /* −1500 gunung api berkabut, −600 deret stupa (di atas lis dinding) */
  const B0=bidang(-1500),B1=bidang(-600);
  svgDi(B0,pustaka.gunungBerlapis({x:1000,y:330,lebar:6200,tinggi:230,lapis:2,puncak:2,seed:5,jarak:-1500,detail:1,cahaya:{arah:250,kuat:.35}}));
  let st='';for(let x=-420;x<3500;x+=210)st+=stupa(x+(x/210%2?18:0),236,1.18);
  svgDi(B1,`<path d="${st}" fill="${pudar('#1a2036',-600)}"/><path d="M-500,232 H3600 V420 H-500Z" fill="${pudar('#151a2c',-600)}"/>`);
  kabut(B0,{y:300,tebal:150,warna:pudar('#5a6688',-1500),rapat:.45,hanyut:4,seed:3});
  kabut(B1,{y:250,tebal:110,warna:pudar('#4a5474',-600),rapat:.3,hanyut:7,seed:8});

  /* 0 dinding galeri: relief hidup (peta tinggi dipanggang sekali, cahaya SINAR tiap frame) */
  const B2=bidang(0),dd=pustaka.dindingRelief({lebar:4300,tinggi:1000,lebarPanel:1000,arah:-1,seed:7});
  reliefHidup(B2,{x:-540,y:100,dinding:dd,dalam:56,seed:7});
  partikel('depan',{jenis:'debu',n:70,seed:6});   // SEBELUM grade(): lapisan depan yang dipasang lebih dulu ikut ter-grade
  grade(0,0,{bayangan:'#121a38',bayanganKuat:.22,sorot:'#ffd2a0',sorotKuat:.18,vignette:.55,halation:0,kontras:1.04,saturasi:.95});

  /* lampu: obor yang dibawa menyusuri galeri dari kanan ke kiri, sedikit naik-turun mengikuti langkah, berkedip */
  Object.assign(SINAR,{x:3600,y:520,z:230,warna:'#ffb067',kuat:2.6,jangkau:650,kedip:.1,seed:4,ambien:'#8296c8',ambienKuat:.5});
  tl.to(SINAR,{x:-300,duration:DUR,ease:'none'},0);
  tl.to(SINAR,{y:548,duration:1.2,ease:'sine.inOut',repeat:15,yoyo:true},0);

  /* kamera: berhenti di tiap panel (titik tengah dd.panel → px bidang), berjalan di antaranya */
  const pusat=dd.panel.map(([x0,,w])=>-540+x0+w/2);   // [460, 1610, 2760]: kiri → kanan; cerita dibaca kanan → kiri
  cutTo(0,{fx:pusat[2]+60,fy:560,zoom:1.06,pitch:0,yaw:0,roll:0,shake:0});
  camTo(0,5.4,{fx:pusat[2]-60},'sine.inOut');camTo(5.4,3.2,{fx:pusat[1]+50},'sine.inOut');camTo(8.6,5,{fx:pusat[1]-70},'sine.inOut');   // berhenti · berjalan 3,2 dtk · berhenti
  camTo(13.6,3.2,{fx:pusat[0]+60},'sine.inOut');camTo(16.8,3.2,{fx:pusat[0]-30},'sine.out');
  handheld(0,DUR,.22);}
/* kait untuk scripts/test-starters.mjs (halaman bawaan) — tidak dipanggil deliverable. Paralaks diukur seperti CAM_UJI (CAM.fx += 300,
   lalu CAM dipulihkan); rigBersih membaca gaya TERHITUNG rig dan setiap [data-z]. */
window.SINEMA_UJI=()=>{const r={},simpan={...CAM},n=s=>document.querySelectorAll(s).length,
    kiri=z=>{const b=BIDANG.find(b=>b.z===z);return b?b.el.getBoundingClientRect().left:NaN;};
  applyCam();const j0=kiri(-1500),d0=kiri(0);CAM.fx+=300;applyCam();r.paralaks=Math.abs((kiri(-1500)-j0)-(kiri(0)-d0))>1;Object.assign(CAM,simpan);applyCam();
  r.kotor=[rig,...rig.querySelectorAll('[data-z]')].filter(e=>{const s=getComputedStyle(e);
    return s.filter!=='none'||s.mixBlendMode!=='normal'||s.opacity!=='1'||s.clipPath!=='none'||s.maskImage!=='none';}).map(e=>e.id||`[data-z="${e.dataset.z}"]`).join(' ');
  r.rigBersih=!r.kotor;
  r.ada={langit:n('#wv-langit'),kabut:n('.wv-kabut'),partikel:n('.wv-partikel'),grade:n('.wv-pasca'),relief:n('.wv-relief')};
  r.adaSemua=r.ada.langit===1&&r.ada.kabut>=2&&r.ada.partikel>=1&&r.ada.grade>0&&r.ada.relief===1;return r;};

/* ---------- timeline: legenda dokumenter; galeriRelief() menambah tween kamera dan SINAR-nya sendiri ---------- */
const tl=gsap.timeline({paused:true});
tl.fromTo('#cap',{opacity:0,y:16},{opacity:1,y:0,duration:.6,ease:'power2.out'},9.2);   // masuk 9,2 → 9,8 dtk: kamera sudah berhenti di panel perahu
tl.to('#cap',{opacity:0,duration:.6,ease:'power2.in'},13);                               // keluar 13 → 13,6 dtk, sebelum kamera berjalan lagi
tl.to({},{duration:.01},DUR);

/* ---------- kontrol: autoplay + loop, tanpa player. ?debug=1 = panel scrub, ?clean=1 = untuk export (tidak autoplay) ---------- */
const q=new URLSearchParams(location.search),vo=$('#vo'),hasVO=!!vo.getAttribute('src');let audioOn=false;
function start(){tl.play(0);if(hasVO){vo.currentTime=0;vo.play().then(()=>audioOn=true).catch(()=>{});}}
/* loop dari jam, BUKAN onComplete: satu tween repeat:-1 (ayunan, kedip, kipas) membuat durasi timeline tak hingga sehingga onComplete tidak pernah terpicu */
gsap.ticker.add(()=>{if(!tl.paused()&&tl.time()>=DUR)start();});
gsap.ticker.add(()=>{if(!audioOn||tl.paused())return;if(Math.abs(vo.currentTime-tl.time())>.12)vo.currentTime=tl.time();});
/* <wv:grain> dibangun dari src/runtime/grain.js — JANGAN edit di sini;
   ubah sumbernya lalu jalankan: node scripts/build-starters.mjs */
/* grain hidup (techniques.md §7d): lapisan butiran film teratas di #stage — di luar #world, jadi tidak
   meratakan paralaks [data-z]. Tile noise dirasterisasi sekali; per frame hanya transform di lapisannya
   sendiri, melompat 12× per detik dengan posisi fungsi murni tl.time() (bukan Math.random) — sama di
   play, scrub, dan ekspor. Memakai tl.eventCallback('onUpdate'); callback yang sudah ada tetap dipanggil,
   jadi pasang onUpdate timeline milik proyek SEBELUM grainHidup(). Latar gelap: overlay .15–.3;
   latar terang: multiply .06–.15. */
function grainHidup(tl, {opacity=.14, blend='overlay', freq=.85}={}){
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='${freq}' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='2.5 0 0 0 -.75 2.5 0 0 0 -.75 2.5 0 0 0 -.75 0 0 0 0 1'/></filter><rect width='256' height='256' filter='url(%23n)'/></svg>`;
  const el=document.createElement('div'); el.className='wv-grain';
  el.style.cssText=`position:absolute;inset:-60px;pointer-events:none;z-index:50;opacity:${opacity};mix-blend-mode:${blend};will-change:transform;transform:translate(-30px,-30px);`+
    `background-image:url("data:image/svg+xml,${svg.replace(/</g,'%3C').replace(/>/g,'%3E')}")`;
  document.getElementById('stage').appendChild(el);
  const prev=tl.eventCallback('onUpdate');
  tl.eventCallback('onUpdate',function(){const k=Math.floor(tl.time()*12);
    el.style.transform=`translate(${k*37%60-30}px,${k*61%60-30}px)`;if(prev)prev.apply(this,arguments);});
  return el;
}
/* </wv:grain> */
/* <wv:seek> dibangun dari src/runtime/seek.js — JANGAN edit di sini;
   ubah sumbernya lalu jalankan: node scripts/build-starters.mjs */
/* seek sinkron untuk snap.mjs / export-frames.mjs / konsol: GSAP menulis gaya secara
   lazy di tick berikutnya dan kanvas menunggu rAF (yang dithrottle di tab tersembunyi),
   jadi tanpa ini screenshot tertinggal satu langkah. pause(t,false) sengaja TIDAK menekan
   callback: onUpdate (applyCam/render) harus ikut jalan saat scrub. apply() = cara starter
   ini menggambar ulang dirinya (kamera, render loop, atau keduanya). */
function makeSeek(tl, apply){ return t => { if (tl.time() === t) tl.pause(t + 1e-4, false);   // pause(t) dari playhead yang sudah di t = no-op: set() pada t=0 tak pernah diterapkan di halaman segar
  tl.pause(t, false);
  if (gsap.ticker.tick) gsap.ticker.tick(); if (apply) apply(t); }; }
/* </wv:seek> */
grainHidup(tl,{opacity:.12});
if(!q.has('kosong'))galeriRelief();   // ?kosong=1: rig + modul tanpa adegan (kerangka uji scripts/test-starters.mjs; kait modul butuh halaman yang belum memakainya)
window.OPENER={W,H,DURATION:DUR,tl,ready:false,seek:makeSeek(tl,applyCam),play:start};
/* <wv:explainer-controls> dibangun dari src/runtime/explainer-controls.js — JANGAN edit di sini;
   ubah sumbernya lalu jalankan: node scripts/build-starters.mjs */
addEventListener('keydown',e=>{if(/^[rR]$/.test(e.key))start();if(e.code==='Space'){e.preventDefault();tl.paused()?tl.play():tl.pause();}});
if(q.has('debug')){const dbg=$('#dbg');dbg.style.display='flex';const sc=$('#dScrub'),ck=$('#dClock');let drag=false;
  gsap.ticker.add(()=>{if(!drag)sc.value=String(tl.time()/DUR*1000);ck.textContent=tl.time().toFixed(2)+'s';$('#dPlay').textContent=tl.paused()?'Play':'Pause';});
  sc.addEventListener('pointerdown',()=>{drag=true;tl.pause();});addEventListener('pointerup',()=>drag=false);
  sc.addEventListener('input',()=>{tl.pause();tl.time(sc.value/1000*DUR);});$('#dPlay').onclick=()=>tl.paused()?tl.play():tl.pause();}
/* </wv:explainer-controls> */
document.fonts.ready.then(()=>{applyCam();window.OPENER.ready=true;if(q.has('clean'))return;
  if(!hasVO){start();return;}
  /* ada suara: coba mulai langsung; bila autoplay diblokir, tahan frame 0 dan mulai pada klik/tombol pertama (tanpa teks petunjuk) */
  vo.play().then(()=>{audioOn=true;vo.currentTime=0;tl.play(0);}).catch(()=>{const go=()=>{removeEventListener('pointerdown',go);removeEventListener('keydown',go);start();};addEventListener('pointerdown',go);addEventListener('keydown',go);});});
</script>
