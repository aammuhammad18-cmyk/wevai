name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  periksa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Sintaks skrip
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done
          node --check scripts/ae/bridge/svg2png.cjs
          python -m py_compile scripts/*.py scripts/ae/bridge/*.py

      - name: Uji inti kamera (node:test, tanpa browser)
        run: node --test scripts/test-kamera.mjs

      - name: Starter sinkron dengan src/runtime
        run: node scripts/build-starters.mjs --check

      - name: Versi seragam di semua berkas
        run: node scripts/bump-version.mjs --check

      - name: Anggaran konteks per jalur baca
        run: node scripts/context-budget.mjs --check

      - name: Lint starter (aturan yang bisa diperiksa mekanis)
        run: |
          node scripts/lint-motion.mjs assets/*.html
          # fixture buruk WAJIB gagal (exit != 0) dan menyebut aturannya — kalau lint berhenti menangkapnya, CI merah
          st=0; out=$(node scripts/lint-motion.mjs evals/bukti/lint-three-buruk.html) || st=$?
          [ "$st" -eq 1 ] || { echo "::error::lint-three-buruk.html seharusnya GAGAL (exit 1), dapat $st"; exit 1; }
          grep -q 'FAIL determinisme-clock' <<<"$out" || { echo '::error::lint-three-buruk.html tidak lagi memicu determinisme-clock'; exit 1; }
          # fixture relatif hanya WARN: exit 0 dan harus memuat gsap-relatif
          out=$(node scripts/lint-motion.mjs evals/bukti/lint-relatif-buruk.html)
          grep -q 'WARN gsap-relatif' <<<"$out" || { echo '::error::lint-relatif-buruk.html tidak lagi memicu gsap-relatif'; exit 1; }

      - name: SRI library CDN masih cocok
        run: node scripts/cdn-integrity.mjs --check assets/*.html

      - name: Uji browser — loop, kontrak OPENER, error halaman
        run: |
          # Ubuntu 24.04 mematikan user namespace tanpa hak istimewa → sandbox Chrome gagal ("No usable sandbox").
          # Jalan keluar resmi puppeteer: izinkan lagi untuk runner ini saja, bukan --no-sandbox di skrip.
          echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          cd scripts && npm install --no-audit --no-fund && cd ..
          node scripts/test-starters.mjs
